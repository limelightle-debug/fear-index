# 号外: the seat counts from NBC News every 5 minutes while the 号外 is on (scripts/update_election.py stops by itself,
# exit 3). The 号外 is over: no schedule and no handover; start it by hand if it is ever needed again.
name: election
on:
  push:
    branches: [main]
    paths: [scripts/update_election.py, .github/workflows/election.yml]
  workflow_dispatch:
concurrency: election
permissions:
  contents: write
jobs:
  seats:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          rc=0; python3 scripts/update_election.py 66 || rc=$?
