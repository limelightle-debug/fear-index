# 過去号: take a kept issue's picture again (for an issue whose kept data was completed afterwards)
name: reshoot
on:
  workflow_dispatch:
    inputs:
      ids: {description: "issue ids, space separated (e.g. 2026-11-04-mor)", required: true}
concurrency: archive
permissions:
  contents: write
jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {path: fear-index}
      - uses: actions/checkout@v4
        with: {repository: limelightle-debug/mri-app, path: mri-app, sparse-checkout: data}
      - uses: actions/checkout@v4
        with: {repository: limelightle-debug/ndx-heatmap, path: ndx-heatmap, sparse-checkout: data}
      - uses: actions/checkout@v4
        with: {repository: limelightle-debug/tqqq, path: tqqq, sparse-checkout: data}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: picture
        run: |
          pip install -q playwright pillow
          python -m playwright install --with-deps chromium >/dev/null
          python fear-index/scripts/snapshot.py . ${{ inputs.ids }}
      - name: commit
        working-directory: fear-index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive
          git diff --cached --quiet && exit 0
          git commit -q -m "Archive picture again: ${{ inputs.ids }}"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
