# 過去号: each time an issue goes out (data/paper.json pushed), keep it with the data it was read with, and as a
# picture (data/archive/img/<id>.jpg) that the page shows in place of the live issue
name: archive
on:
  push:
    branches: [main]
    paths: [data/paper.json]
  workflow_dispatch:
concurrency: archive
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {path: fear-index}
      - uses: actions/checkout@v4
        with: {repository: limelightle-debug/mri-app, path: mri-app, sparse-checkout: data}
      - uses: actions/checkout@v4
        with: {repository: limelightle-debug/ndx-heatmap, path: ndx-heatmap, sparse-checkout: data}
      - uses: actions/checkout@v4
        with: {repository: limelightle-debug/tqqq, path: tqqq, sparse-checkout: data}
      - name: archive the issue
        run: python3 fear-index/.github/scripts/archive.py .
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: keep the issue as a picture
        run: |
          pip install -q playwright pillow
          python -m playwright install --with-deps chromium >/dev/null
          python fear-index/scripts/snapshot.py .
      - name: commit
        working-directory: fear-index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive
          git diff --cached --quiet && exit 0
          git commit -q -m "Archive: $(git diff --cached --name-only | grep -v index.json | sed 's#data/archive/##;s#.json##' | head -1)"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
