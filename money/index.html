<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Money</title>
<meta name="theme-color" content="#050506">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Money">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=LINE+Seed+JP:wght@400;700;800&display=swap">
<style>
:root{--bg:#050506;--panel:#0e0e11;--ink:#f4f4f6;--ink2:#cfcfd6;--muted:#8c8c96;--line:#25252b;--chip:#17171b;
  --neon:#2ee6ff;--green:#5fd08e;--violet:#b59cff;--amber:#ffb547;--warn:#ff4d5e;--axis:#ffffff;
  --f-tick:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"LINE Seed JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}a{color:inherit}
.num,b.n{font-family:var(--f-tick);font-stretch:82%;font-variant-numeric:tabular-nums}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 0 8px}
.brand{display:flex;align-items:center;gap:10px}
.avatar{width:44px;height:44px;border-radius:10px;flex:none;box-shadow:0 0 0 1px var(--line)}
h1{margin:0;font-family:var(--f-tick);font-size:24px;font-weight:800;letter-spacing:.02em;line-height:1.1}
.sub{font-size:12px;color:var(--muted);margin-top:2px}
.seg{display:flex;background:var(--chip);border-radius:8px;padding:3px;gap:2px;margin-top:10px}
.seg button{flex:1;appearance:none;border:0;background:transparent;color:var(--ink2);font:500 13.5px/1 var(--f-body);padding:10px 4px;border-radius:6px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.9),0 1px 2px rgba(0,0,0,.4);font-weight:700}
.sp{display:flex;gap:2px;background:var(--chip);border-radius:7px;padding:2px;margin:6px 0 2px}
.sp button{flex:1;appearance:none;border:0;background:transparent;color:var(--muted);font:500 12px/1 var(--f-body);padding:7px 2px;border-radius:5px;cursor:pointer}
.sp button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:700;box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)}
.sec{margin:28px 2px 4px;text-align:center}
.sec b{display:flex;align-items:center;gap:12px;color:var(--ink);font-weight:800;font-size:15px;letter-spacing:.06em}
.sec b::before,.sec b::after{content:"";flex:1;height:1px;background:var(--line)}
.sec small{display:block;margin-top:4px;font-size:11.5px;color:var(--muted);line-height:1.5}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 6px}
.ph h2{margin:0;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--ink2)}
.ph .asof{font-size:11.5px;color:var(--muted);white-space:nowrap}
.hd{font-size:17px;font-weight:800;line-height:1.4;margin:2px 0 2px}.hd small{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin-top:2px}
.rd{font-size:14px;line-height:1.85;color:var(--ink);margin:8px 0 4px}
.rd p{margin:0 0 8px}
.hero{border-color:#123a44;background:linear-gradient(180deg,#071a20,var(--panel) 70%)}
.big{font-family:var(--f-tick);font-stretch:82%;font-weight:700;font-size:48px;line-height:.95;font-variant-numeric:tabular-nums;color:var(--neon);text-shadow:0 0 18px rgba(46,230,255,.35)}
.big small{font-size:22px;margin-left:2px}
.bigrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 4px}
.bigrow .side{text-align:right;font-size:12px;color:var(--muted);line-height:1.6}.bigrow .side b{color:var(--ink);font-size:15px}
.lbl{font-size:12px;color:var(--ink2);font-weight:700;letter-spacing:.04em}
table.ax{width:100%;border-collapse:collapse;margin:8px 0 2px;font-size:13px}
table.ax th{font-weight:500;color:var(--muted);font-size:11.5px;text-align:right;padding:4px 4px;border-bottom:1px solid var(--line)}
table.ax th:first-child,table.ax td:first-child{text-align:left}
table.ax td{padding:7px 4px;border-bottom:1px solid #1b1b20;text-align:right;font-family:var(--f-tick);font-stretch:85%;font-variant-numeric:tabular-nums;font-size:14px}
table.ax td:first-child{font-family:var(--f-body);font-size:13px;color:var(--ink2)}
table.ax tr.subr td{font-size:12.5px;color:var(--muted);padding-top:2px}table.ax tr.subr td:first-child{padding-left:14px;font-size:12px}
.pos{color:var(--amber)}.neg{color:var(--green)}.warn{color:var(--warn)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0 4px}
.tile{background:#121216;border:1px solid var(--line);border-radius:10px;padding:8px 9px 7px;min-width:0}
.tile span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile b{display:block;font-family:var(--f-tick);font-stretch:82%;font-size:19px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.tile small{font-family:var(--f-tick);font-stretch:85%;font-size:11.5px;color:var(--ink2)}
.tiles.t2{grid-template-columns:repeat(2,1fr)}
.rchart{margin:6px -4px 0}.rchart svg{display:block;width:100%;overflow:visible}
.rchart text{font-family:var(--f-tick);font-stretch:85%;font-size:10.5px;fill:#9a9aa4}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;margin:4px 0 2px;font-size:11.5px;color:var(--ink2)}
.lg i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.lg i.d{background:none!important;border-top:2px dashed;height:0}
.note{font-size:11.5px;color:var(--muted);line-height:1.6;margin:6px 0 0}
.xpl{margin:10px 0 4px;border:1px solid var(--line);border-radius:10px;padding:0 12px}
.xpl summary{list-style:none;cursor:pointer;padding:10px 0;font-size:13.5px;font-weight:700;color:var(--neon)}.xpl summary::-webkit-details-marker{display:none}
.xpl summary::after{content:"＋";float:right;color:var(--muted)}.xpl[open] summary::after{content:"－"}
.xpl p{margin:0 0 10px;font-size:13.5px;line-height:1.75;color:var(--ink2)}.xpl p b{display:block;color:var(--ink);font-size:13.5px;margin-bottom:2px}
table.st{width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0 2px}
table.st th{color:var(--muted);font-weight:500;font-size:11px;text-align:right;padding:4px 3px;border-bottom:1px solid var(--line)}
table.st td{text-align:right;padding:6px 3px;border-bottom:1px solid #1b1b20;font-family:var(--f-tick);font-stretch:85%;font-variant-numeric:tabular-nums}
table.st th:first-child,table.st td:first-child{text-align:left;font-family:var(--f-body)}
table.st tr.now td{color:var(--neon);font-weight:700}
.path{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin:8px 0 2px;font-size:12px}
.path span{background:#121216;border:1px solid var(--line);border-radius:7px;padding:5px 7px;color:var(--ink2)}
.path em{font-style:normal;color:var(--muted);font-family:var(--f-tick);font-size:11px}
.path span.g{border-color:var(--neon);color:var(--ink)}
.frame{display:block;width:100%;border:0;background:transparent;margin-top:6px;min-height:200px}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
.foot{margin-top:20px}
@media (max-width:380px){.big{font-size:42px}.tile b{font-size:17px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><img class="avatar" src="icons/icon-192.png" alt="" width="44" height="44">
      <div><h1>Money</h1><div class="sub" id="sub">金利・量・ものさし　『金利の重力』の枠組みで読む</div></div></div>
    <div class="seg" id="tabs" role="tablist">
      <button type="button" data-tab="rate" aria-pressed="true">金利</button>
      <button type="button" data-tab="qty" aria-pressed="false">量</button>
      <button type="button" data-tab="ruler" aria-pressed="false">ものさし</button>
      <button type="button" data-tab="lib" aria-pressed="false">アプリと書籍</button>
    </div>
  </header>
  <main id="rate"></main>
  <main id="qty" hidden></main>
  <main id="ruler" hidden></main>
  <main id="lib" hidden>
    <iframe class="frame" id="fApps" title="アプリ"></iframe>
    <iframe class="frame" id="fBooks" title="書籍"></iframe>
  </main>
  <div class="foot"></div>
</div>
<script src="../suite.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
const D="../../mri-app/data/",FI="../data/";
const store={get:(k,d)=>{try{return localStorage.getItem("mo."+k)??d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem("mo."+k,v)}catch(e){}}};
const W=()=>Math.min(688,Math.max(300,(document.querySelector(".wrap").clientWidth||360)-30));
const f=(v,d=2)=>v==null||isNaN(v)?"–":(v<0?"−":"")+Math.abs(v).toFixed(d);
const sg=(v,d=2)=>v==null||isNaN(v)?"–":(v<0?"−":v>0?"+":"±")+Math.abs(v).toFixed(d);
const cls=v=>v>0.005?"pos":v<-0.005?"neg":"";
const big=v=>v.toLocaleString("en-US",{maximumFractionDigits:0});
const tr=v=>(v/1e6).toFixed(2);   // millions -> trillions
function dms(k){k=String(k);let m;
  if((m=k.match(/^(\d{4})-Q(\d)$/)))return Date.UTC(+m[1],(+m[2])*3-1,15);
  if((m=k.match(/^(\d{4})-(\d\d)-(\d\d)/)))return Date.UTC(+m[1],+m[2]-1,+m[3]);
  if((m=k.match(/^(\d{4})(\d\d)(\d\d)$/)))return Date.UTC(+m[1],+m[2]-1,+m[3]);
  if((m=k.match(/^(\d{4})-(\d\d)$/)))return Date.UTC(+m[1],+m[2]-1,15);
  return NaN}
const ymj=k=>{const d=new Date(dms(k));return `${d.getUTCFullYear()}年${d.getUTCMonth()+1}月`};
const mdj=k=>{const d=new Date(dms(k));return `${d.getUTCMonth()+1}月${d.getUTCDate()}日`};
const ymdj=k=>{const d=new Date(dms(k));return `${d.getUTCFullYear()}年${d.getUTCMonth()+1}月${d.getUTCDate()}日`};
const qj=k=>k.replace(/^(\d{4})-Q(\d)$/,"$1年第$2四半期");
const mean=a=>a.reduce((s,x)=>s+x,0)/a.length;
const corr=(a,b)=>{const ma=mean(a),mb=mean(b);let s=0,sa=0,sb=0;for(let i=0;i<a.length;i++){s+=(a[i]-ma)*(b[i]-mb);sa+=(a[i]-ma)**2;sb+=(b[i]-mb)**2}return s/Math.sqrt(sa*sb)};
const xpl=(t,P)=>`<details class="xpl"><summary>${t}（詳しく）</summary>${P.map(([a,b])=>`<p><b>${a}</b>${b}</p>`).join("")}</details>`;
const lg=L=>`<div class="lg">${L.map(([n,c,d])=>`<span><i class="${d?"d":""}" style="background:${c};border-color:${c}"></i>${n}</span>`).join("")}</div>`;
const panel=(h,asof,body,cls="")=>`<section class="panel ${cls}"><div class="ph"><h2>${h}</h2><span class="asof">${asof||""}</span></div>${body}</section>`;
const sec=(t,s)=>`<div class="sec"><b>${t}</b>${s?`<small>${s}</small>`:""}</div>`;
// span pickers: data-sp="key:value"; the choice is kept per chart
const SPK={};
const spSeg=(k,opts,def)=>{SPK[k]=SPK[k]||store.get("sp."+k,def);if(!opts.some(o=>o[0]===SPK[k]))SPK[k]=def;
  return `<div class="sp">${opts.map(([v,l])=>`<button type="button" data-sp="${k}:${v}" aria-pressed="${v===SPK[k]}">${l}</button>`).join("")}</div>`};
const cutY=(P,y)=>{if(!P||!P.length||!y||y>=99)return P;const t=P[P.length-1][0]-y*365.25*864e5;return P.filter(q=>q[0]>=t)};

/* ---------- one chart: lines, steps, bars, bands, reference lines, a second axis on the right ---------- */
function chart(S,o={}){
  S=S.filter(s=>s.p&&s.p.length);if(!S.length)return"";
  const Wd=o.W||W(),H=o.H||200,ML=34,MR=o.right?40:44,MT=8,MB=18,PW=Wd-ML-MR,PH=H-MT-MB;
  const L=S.filter(s=>!s.r),R=S.filter(s=>s.r);
  const ts=S.flatMap(s=>s.p.map(q=>q[0]));let t0=o.t0??Math.min(...ts),t1=o.t1??Math.max(...ts);
  const nb=S.find(s=>s.bar);if(nb){const pad=(t1-t0)/Math.max(1,nb.p.length-1)/2;t0-=pad;t1+=pad}
  const lg10=o.log?(v=>Math.log10(v)):(v=>v);
  const rng=(SS,ref,zero)=>{let vs=SS.flatMap(s=>s.p.map(q=>q[1])).filter(v=>v!=null&&isFinite(v)).concat(ref||[]);if(zero)vs.push(0);
    if(o.log)vs=vs.filter(v=>v>0).map(lg10);
    let lo=Math.min(...vs),hi=Math.max(...vs);if(!isFinite(lo)){lo=0;hi=1}
    if(o.log){lo=Math.floor(lo);hi=Math.ceil(hi);if(hi===lo)hi=lo+1;return[lo,hi,1]}
    const sp=hi-lo||Math.abs(hi)*.1||1,st=[.05,.1,.2,.25,.5,1,2,2.5,5,10,20,25,50,100,200,250,500,1000,2000,2500,5000,1e4,2e4,5e4].find(k=>sp/k<=(o.nt||4))||1e5;
    lo=Math.floor(lo/st+1e-9)*st;hi=Math.ceil(hi/st-1e-9)*st;if(hi===lo)hi=lo+st;return[lo,hi,st]};
  const [lo,hi,st]=rng(L.length?L:R,o.ref?o.ref.map(r=>r.v):[],o.zero||L.some(s=>s.bar));
  const [rlo,rhi,rst]=R.length?rng(R,o.rref||[],R.some(s=>s.bar)||o.rzero):[0,1,1];
  const x=t=>ML+(t1===t0?PW:(t-t0)/(t1-t0)*PW),y=v=>MT+(hi-lg10(v))/(hi-lo)*PH,yr=v=>MT+(rhi-v)/(rhi-rlo)*PH;
  const dq=v=>v%1===0?0:(v*10)%1===0?1:2,dec=o.dec??dq(st),rdec=o.rdec??dq(rst);
  const lab=v=>o.log?(10**v>=1000?big(10**v):+(10**v).toPrecision(2)):(Math.abs(v)<1e-9?"0":(v<0?"−":"")+Math.abs(v).toFixed(dec));
  let g="";
  for(let v=lo;v<=hi+1e-9;v+=st)g+=`<line x1="${ML}" x2="${ML+PW}" y1="${(MT+(hi-v)/(hi-lo)*PH).toFixed(1)}" y2="${(MT+(hi-v)/(hi-lo)*PH).toFixed(1)}" stroke="#fff" stroke-opacity="${Math.abs(v)<1e-9&&lo<0&&!o.log?.3:.06}"/><text x="${ML-5}" y="${(MT+(hi-v)/(hi-lo)*PH+3).toFixed(1)}" text-anchor="end"${o.lc?` style="fill:${o.lc}"`:""}>${lab(v)}</text>`;
  if(R.length)for(let v=rlo;v<=rhi+1e-9;v+=rst)g+=`<text x="${ML+PW+5}" y="${(yr(v)+3).toFixed(1)}" style="fill:${o.rc||"#9a9aa4"}">${(()=>{const w=o.rinv?-v:v;return Math.abs(w)<1e-9?"0":(w<0?"−":"")+Math.abs(w).toFixed(rdec)})()}${o.ru||""}</text>`;
  const span=(t1-t0)/(365.25*864e5);
  if(span<1.6){const d=new Date(t0);for(let m=d.getUTCMonth()+1,yy=d.getUTCFullYear();Date.UTC(yy,m,1)<=t1;m++){const tt=Date.UTC(yy,m,1),xx=x(tt),mo=new Date(tt).getUTCMonth();if(span>.8&&mo%2)continue;g+=`<line x1="${xx}" x2="${xx}" y1="${MT}" y2="${MT+PH}" stroke="#fff" stroke-opacity=".07"/><text x="${xx}" y="${H-5}" text-anchor="middle">${mo?mo+1+"月":new Date(tt).getUTCFullYear()}</text>`}}
  else{const step=span>40?10:span>16?5:span>7?2:1;for(let yy=new Date(t0).getUTCFullYear()+1;Date.UTC(yy,0,1)<=t1;yy++){if(yy%step)continue;const xx=x(Date.UTC(yy,0,1));g+=`<line x1="${xx}" x2="${xx}" y1="${MT}" y2="${MT+PH}" stroke="#fff" stroke-opacity=".07"/><text x="${xx}" y="${H-5}" text-anchor="middle">${yy}</text>`}}
  (o.vlines||[]).forEach(([t,lbl,c])=>{if(t<t0||t>t1)return;const xx=x(t);g+=`<line x1="${xx}" x2="${xx}" y1="${MT}" y2="${MT+PH}" stroke="${c||"#fff"}" stroke-opacity=".5" stroke-dasharray="2 3"/>${lbl?`<text x="${xx+3}" y="${MT+9}" style="fill:${c||"#ccc"}">${lbl}</text>`:""}`});
  (o.bands||[]).forEach(b=>{const a=y(Math.min(hi,b.hi)),z=y(Math.max(lo,b.lo));if(z>a)g+=`<rect x="${ML}" y="${a}" width="${PW}" height="${z-a}" fill="${b.c}" opacity="${b.o||.12}"/>`});
  const placed=[];
  (o.ref||[]).forEach(r=>{if(r.v<lo||r.v>hi)return;const yy=y(r.v),ok=r.l&&placed.every(q=>Math.abs(q-yy)>12);if(ok)placed.push(yy);
    g+=`<line x1="${ML}" x2="${ML+PW}" y1="${yy}" y2="${yy}" stroke="${r.c||"#fff"}" stroke-opacity="${r.o||.55}" stroke-dasharray="${r.dash||"4 3"}"/>${ok?`<text x="${ML+3}" y="${yy-3}" style="fill:${r.c||"#ddd"}">${r.l}</text>`:""}`});
  let p="";const ends=[];
  S.forEach(s=>{const Y=s.r?yr:y,P=s.p.filter(q=>q[1]!=null&&isFinite(q[1])&&(!o.log||q[1]>0));if(!P.length)return;
    if(s.bar){const n=P.length,bw=Math.max(1,PW/(n+1)*(s.bw||.65)),z=s.r?yr(Math.max(rlo,0)):y(Math.max(lo,0));
      P.forEach(([t,v],i)=>{const yy=Y(v);p+=`<rect x="${(x(t)-bw/2).toFixed(1)}" y="${Math.min(yy,z).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(.5,Math.abs(yy-z)).toFixed(1)}" fill="${typeof s.c==="function"?s.c(v,i,n):s.c}" opacity="${s.op||.6}"/>`});}
    else{let d="";P.forEach(([t,v],i)=>{const X=x(t).toFixed(1),YY=Y(v).toFixed(1);
        if(!i)d+=`M${X},${YY}`;else if(s.step)d+=`H${X}V${YY}`;else d+=`L${X},${YY}`});
      if(s.step&&s.ext!==false)d+=`H${(ML+PW).toFixed(1)}`;
      p+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="${s.w||1.6}" stroke-linejoin="round"${s.dash?` stroke-dasharray="${s.dash}"`:""} opacity="${s.op||1}"/>`}
    if(s.end!==false&&!s.bar){const e=P[P.length-1];ends.push({y:Y(e[1]),t:s.fmt?s.fmt(e[1]):f(e[1],s.dec??2)+(s.u||""),c:s.c,x:s.r?null:1})}});
  if(!R.length){ends.sort((a,b)=>a.y-b.y);for(let i=1;i<ends.length;i++)if(ends[i].y-ends[i-1].y<11)ends[i].y=ends[i-1].y+11;
    ends.forEach(e=>{p+=`<text x="${ML+PW+5}" y="${(e.y+3.5).toFixed(1)}" style="fill:${e.c};font-weight:700">${e.t}</text>`})}
  const cid="c"+(++CID);
  const lines=p.replace(/<text[\s\S]*?<\/text>/g,""),labels=(p.match(/<text[\s\S]*?<\/text>/g)||[]).join("");
  return `<div class="rchart"><svg viewBox="0 0 ${Wd} ${H}" height="${H}" role="img"><defs><clipPath id="${cid}"><rect x="${ML}" y="${MT-2}" width="${PW}" height="${PH+4}"/></clipPath></defs>${g}<g clip-path="url(#${cid})">${lines}</g>${labels}</svg></div>`;
}
let CID=0;

/* ---------- data ---------- */
const J={};
const get=(k,u)=>fetch(u+(u.includes("?")?"&":"?")+"ts="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null).then(v=>{J[k]=v});
async function load(){

  const pk80r=real.filter(q=>q[0]<Date.UTC(1981,0)).reduce((a,b)=>b[1]>a[1]?b:a);
  const C2=chart([{p:gold,c:"#ffd27a",w:1.6,fmt:v=>big(v)},{p:real,c:"#ffb547",w:1.2,dash:"4 3",fmt:v=>big(v)}],{H:200,log:true,vlines:back?[[dms(pk80[0]),"",""],[dms(back[0]),`${+back[0].slice(0,4)-+pk80[0].slice(0,4)}年後`,"#ffd27a"]]:[]});
  const esc=panel("第一層　インフレのエスカレーター","1980年〜",`<div class="hd">エスカレーターと踊り場<small>名目と、いまのドルに直した金</small></div>${C2}${lg([["金（名目、対数）","#ffd27a"],["いまのドルに直した金","#ffb547",1]])}
    <div class="rd"><p>${ymj(pk80[0])}の${big(pk80[1])}ドルを名目で抜いたのは${back?ymj(back[0]):"–"}。${back?+back[0].slice(0,4)-+pk80[0].slice(0,4):""}年の踊り場があった。いまのドルに直せば、1980年の高値は${big(pk80r[1])}ドルにあたり、いまの${big(gp)}ドルは${gp>pk80r[1]?"それを上回った":"まだその下にある"}。</p><p class="note">金は月末（古い年は四半期末）の終値で数える。月中の高値で数えれば、1980年1月の高値から2008年まで28年の踊り場になる。</p><p>エスカレーターには乗るだけだ。問題は乗る位置で、それを第二層の振り子で選ぶ。突発（第三層）は扱わない。上振れは勝手に入り、下振れは買い場になる。</p></div>`);
  // bitcoin: the halving cycle
  const B=mo.btc.filter(r=>r[0]>="2011-01").map(r=>[dms(r[0]),r[1]]),hv=mo.halvings.map(dms);
  const cyc=hv.map((h,i)=>{const nx=hv[i+1]||Infinity,win=B.filter(q=>q[0]>=h&&q[0]<Math.min(nx,h+30*30.44*864e5));if(!win.length)return null;
    const pk=win.reduce((a,b)=>b[1]>a[1]?b:a),aft=B.filter(q=>q[0]>pk[0]&&q[0]<=pk[0]+20*30.44*864e5),tr2=aft.length?aft.reduce((a,b)=>b[1]<a[1]?b:a):null;
    const mon=(a,b)=>Math.round((b-a)/(30.44*864e5));return{h,pk,pm:mon(h,pk[0]),tr:tr2,tm:tr2?mon(pk[0],tr2[0]):null}}).filter(Boolean);
  const bt=it("btc"),bp=bt?bt.price:B[B.length-1][1],lastH=hv[hv.length-1],mH=Math.round((Date.now()-lastH)/(30.44*864e5));
  const cur=cyc[cyc.length-1],mP=Math.round((Date.now()-cur.pk[0])/(30.44*864e5));
  const C3=chart([{p:B,c:"#ff9f43",w:1.5,fmt:v=>big(v)}],{H:200,log:true,vlines:hv.map(h=>[h,"半減期","#2ee6ff"]).concat([[Date.UTC(2028,3,15),"次（目安）","#2ee6ff"]]),t1:Date.UTC(2028,8,1)});
  const rows=cyc.map(c=>`<tr><td>${ymj(new Date(c.h).toISOString().slice(0,7))}</td><td>${ymj(new Date(c.pk[0]).toISOString().slice(0,7))}</td><td>${c.pm}か月</td><td>${c.tr?ymj(new Date(c.tr[0]).toISOString().slice(0,7)):"–"}</td><td>${c.tm!=null?c.tm+"か月":"–"}</td></tr>`).join("");
  const btc=panel("ビットコイン　半減期の周期",bt?ymdj(bt.time.slice(0,10)):"",`<div class="hd">${big(bp)}ドル<small>半減期から${mH}か月、高値（${ymj(new Date(cur.pk[0]).toISOString().slice(0,7))}）から${mP}か月</small></div>${C3}
    <table class="st"><tr><th>半減期</th><th>高値の月</th><th>まで</th><th>その後の安値</th><th>高値から</th></tr>${rows}</table>
    <p class="note">月末の終値で数える（高値と安値は月中の値ではない）。直近の周期の安値は、まだ途中かもしれない。</p>
    <div class="rd"><p>供給が半分になるのは、コードに書かれた事実だ。供給が減ると価格が上がる、は推論だ。3回でも、機序が説明できれば根拠になる。300回あっても、機序が説明できなければ偶然の一致にすぎない。</p>
    <p>時価総額が小さいうちは希少性が、大きくなると通貨の発行量が価格を決める（推測）。物差しが、測る対象に引きずられる。</p></div>
    ${xpl("帳簿にして物差し",[["書き換えられない帳簿","顔を知らない者どうしで、ヤップ島の石の帳簿を島の外で成り立たせた。全員が管理者で、検証者だ。"],["三条件","発行者がいない、増やしにくい（2100万枚）、何も生まない。三つを満たし、しかも台帳を持つ。弱点は、安全性の一部が数学ではなく損得勘定であること、電力と規制、そして歴史が短いこと。"]])}`);
  // the paper's commodities and FX, with the week
  const W2=J.wk&&J.wk.items||{};
  const wk=k=>{const d=W2[k]&&W2[k].d;if(!d||d.length<6)return null;return(d[d.length-1][1]/d[d.length-6][1]-1)*100};
  const T=[["gold","金","ドル",1,"gold"],["silver","銀","ドル",2],["wti","原油 WTI","ドル",2,"wti"],["copper","銅","ドル",3],["btc","ビットコイン","ドル",0,"btc"],["eth","イーサリアム","ドル",0],["dxy","ドル指数","",2],["usdjpy","ドル円","円",2,"usdjpy"],["eurusd","ユーロドル","",4]];
  const tiles=T.map(([k,n,u,d,wkk])=>{const i=it(k);if(!i)return"";const w=wkk?wk(wkk):null;return`<div class="tile"><span>${n}</span><b>${d===0?big(i.price):i.price.toFixed(d)}</b><small class="${cls(i.pct)}">${sg(i.pct,2)}%</small>${w!=null?`<small>　週 ${sg(w,1)}%</small>`:""}</div>`}).join("");
  const gg=it("gold"),oo=it("wti"),cc=it("copper"),bb=it("btc"),dd=it("dxy");
  const rd=[];
  if(gg&&dd)rd.push(gg.pct>0&&dd.pct<0?"金高とドル安が重なった。物差しの側から見れば、ドルが軽くなった日だ。":gg.pct<0&&dd.pct>0?"ドル高が金を押さえた。振り子がドルの側に振れている。":gg.pct>0&&dd.pct>0?"ドル高でも金が上がった。ドル以外の不安が金を買わせている。":"金もドルも下げた。");
  if(oo&&cc)rd.push(oo.pct>0&&cc.pct>0?"原油と銅がそろって上げ、景気の側の需要を映す。":oo.pct<0&&cc.pct<0?"原油と銅がそろって下げ、景気への見方が冷えている。":"原油と銅は向きが分かれた。");
  if(bb)rd.push(bb.pct>0?"ビットコインは上げ、リスクを取る気分は残っている。":"ビットコインは下げ、リスクを取る気分は引いている。");
  const cm=panel("商品とドル",J.mk?ymdj(J.mk.updatedAt.slice(0,10)):"",`<div class="tiles">${tiles}</div><div class="rd"><p>${rd.join("")}</p></div>`);
  $("ruler").innerHTML=hero+sec("ゴールド","三つの層：インフレ、ドル、突発")+pend+esc+sec("ビットコイン","帳簿にして物差し")+btc+sec("商品と為替","恐怖新聞の対象")+cm;
}

/* ---------- tabs ---------- */
let TAB=store.get("tab","rate");
function render(){
  try{renderRate()}catch(e){console.error(e);$("rate").innerHTML=`<div class="empty">金利タブを表示できません（${e.message}）</div>`}
  try{renderQty()}catch(e){console.error(e);$("qty").innerHTML=`<div class="empty">量タブを表示できません（${e.message}）</div>`}
  try{renderRuler()}catch(e){console.error(e);$("ruler").innerHTML=`<div class="empty">ものさしタブを表示できません（${e.message}）</div>`}
  show(TAB,true);
}
function show(t,keep){
  if(!["rate","qty","ruler","lib"].includes(t))t="rate";TAB=t;store.set("tab",t);
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.tab===t));
  ["rate","qty","ruler","lib"].forEach(k=>$(k).hidden=k!==t);
  if(t==="lib"){const fit=fr=>{try{fr.style.height=fr.contentDocument.documentElement.scrollHeight+"px"}catch(e){}};
    [["fApps","apps"],["fBooks","books"]].forEach(([id,k])=>{const fr=$(id);if(!fr.src){fr.addEventListener("load",()=>{fit(fr);try{new ResizeObserver(()=>fit(fr)).observe(fr.contentDocument.body)}catch(e){}});fr.src="../?embed="+k}else fit(fr)})}
  if(!keep)window.scrollTo(0,0);
}
document.addEventListener("click",e=>{
  const b=e.target.closest("#tabs button");if(b){show(b.dataset.tab);return}
  const s=e.target.closest("[data-sp]");if(s){const [k,v]=s.dataset.sp.split(":");SPK[k]=v;store.set("sp."+k,v);
    const y=window.scrollY;if(TAB==="rate")renderRate();else if(TAB==="qty")renderQty();else renderRuler();window.scrollTo(0,y)}
});
let rw=0;window.addEventListener("resize",()=>{const w=W();if(Math.abs(w-rw)>20){rw=w;render()}});
rw=W();load();
setInterval(()=>{if(!document.hidden)load()},15*60*1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
if("serviceWorker" in navigator&&!/[?&]shot\b/.test(location.search))navigator.serviceWorker.register("sw.js").catch(()=>{});
window.Suite&&Suite.foot(".foot");
</script>
