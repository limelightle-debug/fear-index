<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>恐怖指数研究所</title>
<meta name="description" content="恐怖指数研究所の朝刊：MRI・VIX・TQQQ・Nasdaq 100 を上から下まで一枚で">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="恐怖指数研究所">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a1a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=LINE+Seed+JP:wght@400;700;800&display=swap">
<style>
:root{
  /* the same navy palette as the individual apps */
  --bg:#0a0a1a; --panel:#111127; --ink:#f2f2f7; --ink2:#c4c4d4; --muted:#8a8aa6; --line:#2a2a4a; --chip:#1a1a36; --accent:#7fa8ff;
  --l1:#1a6b2a; --l2:#4CAF50; --l3:#FFC107; --l4:#FF5722; --l5:#B71C1C;
  --up:#4CAF50; --dn:#F44336; --buy:#4CAF50; --sell:#F44336; --amber:#FF9800;
  --f-tick:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"LINE Seed JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
a{color:inherit}
.num{font-family:var(--f-tick);font-stretch:82%;font-variant-numeric:tabular-nums}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 0 8px}
.brand{display:flex;align-items:center;gap:10px}
.avatar{width:44px;height:44px;border-radius:10px;flex:none;box-shadow:0 0 0 1px var(--line)}
h1{margin:0;font-size:21px;font-weight:800;letter-spacing:.04em;line-height:1.15}
.ed{font-size:12px;color:var(--muted);margin-top:2px}
.ed b{color:var(--ink2);font-weight:700}
.seg{display:flex;background:var(--chip);border-radius:8px;padding:3px;gap:2px;margin-top:10px}
.seg button{flex:1;appearance:none;border:0;background:transparent;color:var(--ink2);font:500 13.5px/1 var(--f-body);padding:9px 6px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.9),0 1px 2px rgba(0,0,0,.4);font-weight:700}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 8px}
.ph h2{margin:0;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--ink2)}
.ph .more{font-size:11.5px;color:var(--accent);text-decoration:none;white-space:nowrap}
.ph .asof{font-size:11.5px;color:var(--muted)}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
/* lead */
.lead{border-color:#3a3a66;background:linear-gradient(180deg,#16163a,var(--panel))}
.lead ul{margin:0;padding:0;list-style:none}
.lead li{position:relative;padding:5px 0 5px 14px;font-size:14px;line-height:1.55;color:var(--ink)}
.lead li::before{content:"";position:absolute;left:0;top:13px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.lead li b{font-family:var(--f-tick);font-stretch:82%;font-weight:700}
/* MRI */
.mri{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.lvl{display:inline-block;padding:4px 12px;border-radius:20px;font-size:14px;font-weight:700}
.big{font-family:var(--f-tick);font-stretch:82%;font-weight:700;font-size:46px;line-height:.95;font-variant-numeric:tabular-nums}
.chg{font-family:var(--f-tick);font-stretch:82%;font-size:12.5px;color:var(--ink2);text-align:right;margin-top:2px}
.rampw{position:relative;padding-top:24px;margin-top:10px}
.ramp{position:relative;height:16px;border-radius:8px;background:linear-gradient(to right,var(--l1) 10%,var(--l2) 30%,var(--l3) 50%,var(--l4) 70%,var(--l5) 90%)}
.ramp .mk{position:absolute;top:50%;width:6px;height:24px;background:#fff;border-radius:3px;box-shadow:0 0 10px rgba(255,255,255,.9);transform:translate(-50%,-50%)}
.ramp .tk{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:1px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.45);transform:translateX(-50%)}
.flag{--p:50%;position:absolute;top:0;transform:translateX(calc(-1 * var(--p)));white-space:nowrap;display:flex;align-items:center;height:19px;font-weight:800;font-size:10.5px;line-height:1;letter-spacing:.08em;color:#fff;padding:0 7px 0 8px;border-radius:5px;box-shadow:0 2px 6px rgba(0,0,0,.55);background:var(--c)}
.flag::after{content:"";position:absolute;left:var(--p);top:100%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--c)}
.flag b{font-family:var(--f-tick);font-stretch:82%;font-size:11px;margin-left:3px}
.flag.buy{--p:28%;--c:var(--buy)}.flag.sell{--c:var(--sell)}
.flag.on{outline:2px solid #fff}
.sigs{margin-top:12px;border-top:1px solid var(--line)}
.sg{display:grid;grid-template-columns:1fr auto 92px;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.sg:last-child{border-bottom:0;padding-bottom:0}
.sgn{font-weight:800;font-size:13px;white-space:nowrap}
.sgn small{display:block;font-weight:600;font-size:10.5px;color:var(--muted);margin-top:2px}
.tag{display:inline-block;font-style:normal;font-weight:800;font-size:9px;letter-spacing:.06em;color:#fff;background:var(--sell);border-radius:4px;padding:1px 5px;margin-right:5px}
.tag.buy{background:var(--buy)}
.lamps{display:flex;gap:7px;background:#07070f;border:1px solid var(--line);border-radius:16px;padding:5px 9px}
.lamps i{width:16px;height:16px;border-radius:50%;background:var(--c);opacity:.18}
.lamps i.on{opacity:1;box-shadow:0 0 9px 2px var(--c)}
.sgv{text-align:right;font-family:var(--f-tick);font-stretch:82%;font-size:12px;color:var(--ink2);white-space:nowrap;line-height:1.3}
.sgv b{display:block;font-family:var(--f-body);font-stretch:100%;font-weight:600;font-size:10px;color:var(--muted)}
/* key figures */
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:#0d0d22;border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.kv span{display:block;font-size:10.5px;color:var(--muted);white-space:nowrap}
.kv b{display:block;font-family:var(--f-tick);font-stretch:82%;font-weight:700;font-size:20px;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap}
.kv small{display:block;font-family:var(--f-tick);font-stretch:82%;font-size:11.5px;color:var(--ink2);white-space:nowrap}
.up,.kv .up{color:var(--up)}.dn,.kv .dn{color:var(--dn)}
.kv b em{font-style:normal}.kv b .sl{font-size:14px;color:var(--muted)}
.movers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.movers h3{margin:0 0 4px;font-size:11px;font-weight:700;color:var(--muted)}
.movers ol{margin:0;padding:0;list-style:none}
.movers li{display:flex;justify-content:space-between;gap:6px;padding:4px 0;border-top:1px solid var(--line);font-family:var(--f-tick);font-stretch:85%;font-size:13px}
.movers li span{color:var(--ink2)}
.bar2{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:10px;background:var(--chip)}
.bar2 i{display:block;height:100%}
.bar2l{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:3px}
/* app map */
.soon{padding:28px 0;text-align:center;color:var(--muted)}
/* morning paper: one row per index, name / level / bar around zero / change */
.irow{display:grid;grid-template-columns:7.4em 78px minmax(30px,1fr) 66px;align-items:center;gap:8px;padding:9px 0;line-height:1.2}
.irow+.irow{border-top:1px solid var(--line)}
.irow .nm{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.irow .lv{font-size:13px;color:var(--ink2);text-align:right}
.irow .v{font-size:16px;font-weight:700;text-align:right}
.irow .bar{position:relative;height:10px}
.irow .bar::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line)}
.irow .bar i{position:absolute;top:0;bottom:0}
.up{color:var(--up)}.dn{color:var(--dn)}
.layer{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:#0d0d22}
.lh{display:flex;align-items:center;gap:8px;margin:0 0 4px}
.lh b{font-size:13px;letter-spacing:.06em}
.lh span{font-size:11px;color:var(--muted)}
.node{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);text-decoration:none}
.lh+.node{border-top:0}
.node img{width:44px;height:44px;border-radius:10px;flex:none;box-shadow:0 0 0 1px var(--line)}
.node b{display:block;font-size:14.5px}
.node span{display:block;font-size:12px;color:var(--muted);line-height:1.45}
.node em{margin-left:auto;font-style:normal;color:var(--accent);font-size:18px}
.arrow{text-align:center;color:var(--accent);font-size:18px;line-height:1;padding:5px 0}
.soonl{margin-top:12px;border-style:dashed;background:transparent}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:4px 0 2px}
.chips span{font-size:12px;color:var(--ink2);background:var(--chip);border-radius:999px;padding:3px 10px}
/* apps and books */
.app{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);text-decoration:none}
.app:first-of-type{border-top:0;padding-top:2px}
.app img{width:52px;height:52px;border-radius:12px;flex:none;box-shadow:0 0 0 1px var(--line)}
.app b{display:block;font-size:15px}
.app span{display:block;font-size:12px;color:var(--muted);line-height:1.45}
.app em{margin-left:auto;font-style:normal;color:var(--accent);font-size:18px}
.tree{position:relative;margin:2px -14px 10px;background:#070712;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tree img{display:block;width:100%;height:auto}
.tree a{position:absolute;border-radius:6px}
.tree a:active{background:rgba(127,168,255,.25)}
.book .ly{display:inline-block;font-style:normal;font-size:10px;font-weight:700;color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:0 6px;margin-bottom:2px}
.lh .kan{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border:1.5px solid var(--ink);border-radius:50%;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-size:14px;margin-right:2px}
.node .ch{font-style:normal;font-weight:400;font-size:11px;color:var(--muted);margin-left:8px;white-space:nowrap}
.bmap{position:relative}
.bmap.solo::before{display:none}
.bmap::before{content:"";position:absolute;left:22px;top:32px;bottom:32px;width:2px;background:var(--line)}
.book{position:relative;display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);text-decoration:none}
.book em{margin-left:auto;font-style:normal;color:var(--accent);font-size:18px}
.book .cv{position:relative;z-index:1}
.book:first-of-type{border-top:0;padding-top:2px}
.book .cv{width:44px;height:64px;border-radius:4px;flex:none;object-fit:cover;background:linear-gradient(160deg,#2a1020,#0b0b18);box-shadow:0 0 0 1px var(--line);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--muted);text-align:center;line-height:1.2;padding:3px}
.book b{display:block;font-size:15px}
.book span{display:block;font-size:12px;color:var(--accent)}
.foot{margin-top:18px;text-align:center;font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <img class="avatar" src="icons/app.png" alt="" width="44" height="44">
      <div>
        <h1>恐怖指数研究所</h1>
        <div class="ed" id="ed">読み込み中…</div>
      </div>
    </div>
    <div class="seg" id="tabs" role="group" aria-label="表示">
      <button type="button" data-tab="paper">朝刊</button>
      <button type="button" data-tab="apps">アプリ</button>
      <button type="button" data-tab="books">書籍</button>
    </div>
  </div>

  <div id="t-paper">
    <section class="panel" id="idx"><div class="soon">読み込み中…</div></section>
  </div>

  <div id="t-apps" hidden>
    <section class="panel" id="apps"></section>
    <section class="panel books" data-head="ph" data-books="vix:parts"></section>
  </div>

  <div id="t-books" hidden>
    <section class="panel" id="books"></section>
    <section class="panel" id="books-en"></section>
  </div>

  <div class="foot">© 恐怖指数研究所 Gold Locks</div>
</div>

<script src="books.js"></script>
<script>
const APP_VER="fi-v27";
const $=id=>document.getElementById(id);
const BASE="https://limelightle-debug.github.io";
const APPS=[
  ["mri","Market Risk Index","VIX・SKEW・CAPE から天井と底を推定する MRI と、そのシグナル",`${BASE}/mri-app/`,"icons/app-mri.png"],
  ["vix","VIX Events","VIX イベントの記録と周期",`${BASE}/mri-app/vix/`,"icons/app-vix.png"],
  ["tqqq","TQQQ","TQQQ の価格、高値からの下落、年次の成績",`${BASE}/tqqq/`,"icons/app-tqqq.png"],
  ["mind","Mind","毎朝の局面と、今大切な言葉、陥りやすいバイアス",`${BASE}/mind/`,"icons/app-mind.png"],
  ["ndx","Nasdaq 100","構成銘柄のヒートマップ、騰落率、組入比率",`${BASE}/ndx-heatmap/`,"icons/app-ndx.png"]];
// the books in the order of the institute's book map, each linking to its Amazon page
// [title, Amazon, cover, layer in the tree, the title's box on the tree image in % (left, top, width, height)]
const BOOKS=[["VIXの声を聴け","https://amzn.asia/d/0hrhh1Ny","icons/book-vix.jpg","樹",[34,36,32,7]],["Listen to VIX","https://amzn.asia/d/07rtXhVo","icons/book-vix-en.jpg","",null,"en"],["金利の重力","https://amzn.asia/d/04cgLpEq","icons/book-kinri.jpg","地",[40.5,60,19.5,6.5]],
  ["帳簿と物差し","https://amzn.asia/d/03aL6HY1","icons/book-chobo.jpg","根",[25.5,73,21,6.5]],["失敗の魔術師","https://amzn.asia/d/0hWKU73R","icons/book-shippai.jpg","根",[56,73,21,6.5]],
  ["兵法に学べ","https://amzn.asia/d/02BQOi5d","icons/book-heiho.jpg","根",[25.5,81.5,18,6.5]],["相場のアノマリーを斬る","https://amzn.asia/d/0boQWl0D","icons/book-anomaly.jpg","根",[49,81.5,36,6.5]]];
const store={get:(k,d)=>{try{return localStorage.getItem("fi."+k)??d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem("fi."+k,v)}catch(e){}}};
const state={tab:store.get("tab","apps")};
const DATA={};

const pc=(v,d=1)=>`${v>=0?"+":"−"}${Math.abs(v*100).toFixed(d)}%`;
const sg=(v,d=2)=>`${v>=0?"+":"−"}${Math.abs(v).toFixed(d)}`;
const ymd=n=>{const s=String(n);return`${s.slice(0,4)}/${+s.slice(4,6)}/${+s.slice(6,8)}`};
const md=n=>{const s=String(n);return`${+s.slice(4,6)}/${+s.slice(6,8)}`};
const LEVELS=[[.2,"Very Low","--l1","#fff"],[.4,"Low","--l2","#fff"],[.6,"Medium","--l3","#000"],[.8,"High","--l4","#fff"],[2,"Very High","--l5","#fff"]];
const level=v=>LEVELS.find(l=>v<l[0]);

/* ---------- signals: the same rules as the MRI app ---------- */
// lights stay on (at the highest level reached) until reset; judged on the values as computed at the time
// (pit) and on signals certified by hand; technical bubble = CAPE score alone
function signals(D,lastN){
  let R=(D.daily||[]).filter(r=>r[0]>=20180101&&r[0]<=lastN);
  const PIT=D.pit||{},CERT={};(D.certified||[]).forEach(c=>{CERT[c.signal+c.date]=Math.max(CERT[c.signal+c.date]||0,c.level)});
  R=R.map(r=>{const q=PIT[r[0]];if(!q)return r;const x=r.slice();x[6]=q[0];x[7]=q[1];return x});
  const latch=(key,lvl,reset)=>{const E=[];let cur=null;R.forEach((r,i)=>{if(cur&&reset(r)){cur.off=r[0];cur=null}const l=Math.max(lvl(r),CERT[key+r[0]]||0);
    if(l>(cur?cur.lv:0)){if(!cur){cur={on:r[0],lv:0,off:null};E.push(cur)}cur.lv=l}});return E};
  const up=(v,a)=>v>=a[2]?3:v>=a[1]?2:v>=a[0]?1:0,dn=(v,a)=>v<=a[2]?3:v<=a[1]?2:v<=a[0]?1:0;
  return[["tbub","テクニカルバブル","sell","CAPE 単独",latch("tbub",r=>up(r[6],[.841345,.97725,.99865]),r=>r[6]<=.5)],
    ["sell","SELL","sell","MRI",latch("sell",r=>up(r[7],[.8,.85,.9]),r=>r[7]<=.5)],
    ["buy","BUY","buy","MRI",latch("buy",r=>dn(r[7],[.075,.05,.025]),r=>r[7]>=.5)]].map(([k,name,side,basis,E])=>{
      const e=E[E.length-1],on=!!(e&&e.off==null);return{k,name,side,basis,lv:on?e.lv:0,on,since:on?e.on:null,reset:e&&!on?e.off:null}});
}

/* ---------- sections ---------- */
function renderMRI(){
  const D=DATA.mri;if(!D){$("p-mri").innerHTML="";return null}
  // the morning edition: the last confirmed day (the realtime day, if any, is left to the MRI app)
  const rows=D.daily.filter(r=>r[0]!==D.liveDay),r=rows[rows.length-1],p=rows[rows.length-2];
  const m=r[7],lv=level(m),S=signals(D,r[0]);
  const C=["#4CAF50","#FF9800","#F44336"];
  $("p-mri").innerHTML=`<div class="ph"><h2>MRI</h2><a class="more" href="${APPS[0][3]}">MRI アプリで詳しく ›</a></div>
    <div class="mri"><div><div class="ed" style="margin:0 0 6px">米国 ${md(r[0])} 確定値</div><span class="lvl" style="background:var(${lv[2]});color:${lv[3]}">${lv[1]}</span></div>
      <div><div class="big" style="color:var(${lv[2]})">${(m*100).toFixed(2)}</div><div class="chg">前日比 ${sg((m-p[7])*100)}pt</div></div></div>
    <div class="rampw"><div class="flag buy${m<=.075?" on":""}" style="left:7.5%">BUY<b>7.5</b></div><div class="flag sell${m>=.8?" on":""}" style="left:80%">SELL<b>80</b></div>
      <div class="ramp"><div class="tk" style="left:7.5%"></div><div class="tk" style="left:80%"></div><div class="mk" style="left:${Math.min(Math.max(m*100,1),99)}%"></div></div></div>
    <div class="sigs">${S.map(s=>`<div class="sg"><div class="sgn">${s.name}<small><em class="tag ${s.side}">${s.side.toUpperCase()}</em>${s.basis}</small></div>
      <div class="lamps">${C.map((c,i)=>`<i class="${i<s.lv?"on":""}" style="--c:${c}"></i>`).join("")}</div>
      <div class="sgv">${s.on?`<b>点灯 Lv. ${s.lv}</b>${ymd(s.since)}`:s.reset?`<b>リセット</b>${ymd(s.reset)}`:"–"}</div></div>`).join("")}</div>`;
  return{r,p,m,lv,S};
}
function renderVIX(){
  const V=DATA.vix;if(!V){$("p-vix").innerHTML="";return null}
  const q=V.quote||{},px=q.price,prev=q.prevClose;
  // the last VIX event and the months since it began
  const ev=(V.events||[]).slice(-1)[0],info=ev&&V.eventInfo?V.eventInfo[String(ev)]:null;
  const now=new Date(),evd=info?String(info.day):null;
  const months=evd?(now.getFullYear()*12+now.getMonth())-(+evd.slice(0,4)*12+(+evd.slice(4,6)-1)):null;
  $("p-vix").innerHTML=`<div class="ph"><h2>VIX</h2><a class="more" href="${APPS[1][3]}">VIX アプリで詳しく ›</a></div>
    <div class="kv"><div><span>VIX ${q.time?md(q.time.replace(/-/g,"").slice(0,8)):""} 終値</span><b>${px!=null?px.toFixed(2):"–"}</b><small class="${px<prev?"up":"dn"}">${px!=null&&prev?sg(px-prev):""}</small></div>
      <div><span>前回の VIX イベント</span><b>${evd?`${evd.slice(0,4)}/${+evd.slice(4,6)}`:"–"}</b><small>${info?`ピーク ${info.peak}`:""}</small></div>
      <div><span>そこからの経過</span><b>${months!=null?`${months}<em class="sl"> ヶ月</em>`:"–"}</b><small>${V.events?`1997年以降 ${V.events.length} 回`:""}</small></div></div>`;
  return{px,prev,months};
}
function renderTQQQ(){
  const T=DATA.tqqq;if(!T){$("p-tqqq").innerHTML="";return null}
  const d=T.daily||[],last=d[d.length-1],prev=d[d.length-2];if(!last)return null;
  const ath=Math.max(...d.map(r=>r[4])),dd=last[4]/ath-1,ch=last[4]/prev[4]-1;
  const y0=d.filter(r=>Math.floor(r[0]/10000)<Math.floor(last[0]/10000)).slice(-1)[0],ytd=y0?last[4]/y0[4]-1:null;
  $("p-tqqq").innerHTML=`<div class="ph"><h2>TQQQ</h2><a class="more" href="${APPS[2][3]}">TQQQ アプリで詳しく ›</a></div>
    <div class="kv"><div><span>${md(last[0])} 終値</span><b>${last[4].toFixed(2)}</b><small class="${ch>=0?"up":"dn"}">${pc(ch,2)}</small></div>
      <div><span>上場来高値から</span><b class="${dd>=-.001?"up":"dn"}">${pc(dd)}</b><small>高値 ${ath.toFixed(2)}</small></div>
      <div><span>年初来</span><b class="${ytd>=0?"up":"dn"}">${ytd!=null?pc(ytd):"–"}</b><small>QQQ ${last[6]!=null?last[6].toFixed(2):""}</small></div></div>`;
  return{last,ch,dd};
}
function renderNDX(){
  const N=DATA.ndx;if(!N){$("p-ndx").innerHTML="";return null}
  const ix=N.index||{},ch=ix.prev?ix.price/ix.prev-1:null,d1=(N.perf||{}).d1||{};
  const name=Object.fromEntries((N.stocks||[]).map(s=>[s.t,s.name]));
  const arr=Object.entries(d1).filter(([,v])=>v!=null).sort((a,b)=>b[1]-a[1]);
  const upN=arr.filter(([,v])=>v>0).length,dnN=arr.filter(([,v])=>v<0).length,flat=arr.length-upN-dnN;
  const li=([t,v])=>`<li><b>${t}</b><span class="${v>=0?"up":"dn"}">${v>=0?"+":"−"}${Math.abs(v).toFixed(2)}%</span></li>`;
  $("p-ndx").innerHTML=`<div class="ph"><h2>Nasdaq 100</h2><a class="more" href="${APPS[3][3]}">Nasdaq 100 アプリで詳しく ›</a></div>
    <div class="kv" style="grid-template-columns:1.4fr 1fr"><div><span>指数 ${ix.time||""}</span><b>${ix.price!=null?ix.price.toLocaleString("en-US",{maximumFractionDigits:2}):"–"}</b><small class="${ch>=0?"up":"dn"}">${ch!=null?pc(ch,2):""}</small></div>
      <div><span>上昇 / 下落</span><b><em class="up">${upN}</em><em class="sl"> / </em><em class="dn">${dnN}</em></b><small>横ばい ${flat}</small></div></div>
    <div class="bar2"><i style="width:${upN/arr.length*100}%;background:var(--up)"></i><i style="width:${flat/arr.length*100}%;background:var(--muted)"></i><i style="width:${dnN/arr.length*100}%;background:var(--dn)"></i></div>
    <div class="movers"><div><h3>上昇率 上位</h3><ol>${arr.slice(0,3).map(li).join("")}</ol></div><div><h3>下落率 上位</h3><ol>${arr.slice(-3).reverse().map(li).join("")}</ol></div></div>`;
  return{ch,upN,dnN,top:arr[0],bottom:arr[arr.length-1],name};
}

/* ---------- the lead: a few lines written from the figures ---------- */
function renderLead(M,V,T,N){
  const L=[];
  if(M){
    L.push(`MRI は <b>${(M.m*100).toFixed(2)}</b>（${M.lv[1]}、前日比 ${sg((M.m-M.p[7])*100)}pt）。`+
      (M.m>=.8?"SELL ライン（80）を超えています。":M.m<=.075?"BUY ライン（7.5）を下回っています。":`BUY 7.5 と SELL 80 の間。`));
    const on=M.S.filter(s=>s.on);
    L.push(on.length?on.map(s=>`${s.name} <b>Lv. ${s.lv}</b> 点灯中（${ymd(s.since)}〜）`).join("、")+"。":"点灯中のシグナルはありません。");
  }
  if(V&&V.px!=null)L.push(`VIX は <b>${V.px.toFixed(2)}</b>（${sg(V.px-V.prev)}）。前回の VIX イベントから ${V.months} ヶ月。`);
  if(T)L.push(`TQQQ は <b>${T.last[4].toFixed(2)}</b>（${pc(T.ch,2)}）、上場来高値から ${pc(T.dd)}。`);
  if(N&&N.top)L.push(`Nasdaq 100 は ${N.ch!=null?pc(N.ch,2):""}、上昇 ${N.upN}・下落 ${N.dnN}。上昇率トップは ${N.top[0]}（+${N.top[1].toFixed(2)}%）、下落率トップは ${N.bottom[0]}（−${Math.abs(N.bottom[1]).toFixed(2)}%）。`);
  $("lead").innerHTML=L.map(x=>`<li>${x}</li>`).join("");
  $("leadAsof").textContent=M?`米国 ${md(M.r[0])} 終値`:"";
}

function renderPaper(){
  const any=Object.keys(DATA).length;$("empty").hidden=!!any;$("paper").hidden=!any;if(!any)return;
  const M=renderMRI(),V=renderVIX(),T=renderTQQQ(),N=renderNDX();renderLead(M,V,T,N);
}
// the individual apps by role: judge (when) -> trade (what) <- look inside; what comes next
// the apps placed on the parts of 『VIXの声を聴け』: [part, its role, its title, [app, what it does, chapter]]
const MAP=[
  ["影","観測","黒鳥の影を追う",[["mri","相場の天井を捉える","第三章"]]],
  ["心","心理","黒鳥と踊れ",[["mind","今大切な格言と、陥りやすいバイアス","第四・五章"]]],
  ["技","判定と実行","黒鳥と翔べ",[["vix","VIX イベント。底を捉える","第九章"],["tqqq","弾を選ぶ","第十一章"]]],
  ["体","設計と運用","黒鳥に備えろ",[["ndx","ポートフォリオの主軸を選ぶ。環境認識","第十四章"]]]];
function renderApps(){
  const A=Object.fromEntries(APPS.map(a=>[a[0],a]));
  const card=([k,role,ch])=>{const[,n,,url,ic]=A[k];return`<a class="node" href="${url}"><img src="${ic}" alt="" width="44" height="44"><div><b>${n}${ch?`<i class="ch">${ch}</i>`:""}</b><span>${role}</span></div><em>›</em></a>`};
  $("apps").innerHTML=`<div class="ph"><h2>個別アプリ</h2><span class="asof">『VIXの声を聴け』に沿って</span></div>`+
    MAP.map(([k,role,title,items],i)=>`${i?`<div class="arrow">↓</div>`:""}<div class="layer"><div class="lh"><b class="kan">${k}</b><b>${role}</b><span>${title}</span></div>${items.map(card).join("")}</div>`).join("");
}
function bookRow([b,url,cv,layer]){
  return `<a class="book" href="${url}" target="_blank" rel="noopener">${cv?`<img class="cv" src="${cv}" alt="" width="44" height="64">`:`<div class="cv">${b}</div>`}<div>${layer?`<i class="ly">${layer}</i>`:""}<b>${/^[\x00-\x7F]+$/.test(b)?b:`『${b}』`}</b><span>Amazon で見る</span></div><em>›</em></a>`;
}
function renderBooks(){
  // the tree (tap a title to open its Amazon page), then the same books as a list; the English edition sits in its own panel below
  $("books").innerHTML=`<div class="ph"><h2>書籍体系図</h2><span class="asof">Gold Locks / 恐怖指数研究所</span></div>
    <div class="tree"><img src="icons/book-map.jpg" alt="書籍体系図" width="1200" height="902" onerror="if(!this.dataset.r){this.dataset.r=1;this.src='icons/book-map.jpg?r='+Date.now()}">${BOOKS.filter(x=>x[4]).map(([b,url,,,r])=>`<a href="${url}" target="_blank" rel="noopener" aria-label="『${b}』" style="left:${r[0]}%;top:${r[1]}%;width:${r[2]}%;height:${r[3]}%"></a>`).join("")}</div>
    <div class="bmap">${BOOKS.filter(x=>!x[5]).map(bookRow).join("")}</div>`;
  $("books-en").innerHTML=`<div class="ph"><h2>英語版</h2><span class="asof">English edition</span></div><div class="bmap solo">${BOOKS.filter(x=>x[5]).map(bookRow).join("")}</div>`;
}
function renderTabs(){
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.tab===state.tab));
  ["paper","apps","books"].forEach(k=>$("t-"+k).hidden=state.tab!==k);
}
function renderEd(){
  const d=new Date(),w="日月火水木金土"[d.getDay()];
  $("ed").innerHTML=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${w}）`;
}

/* ---------- data: each app's own published data (same site) ---------- */
// morning paper: the major indices at the last US close
const PAPER="../mri-app/data/indices.json", ORDER=["SPX","NDX","DJI","RUT","SOX"];
let IDX=null;
const nyLabel=t=>{  // Cboe "2026-10-27T16:14:59" or Nasdaq "Oct 27, 2026": the day, and the close or the time
  let m=String(t||"").match(/^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d)/);
  if(m){const d=new Date(Date.UTC(+m[1],+m[2]-1,+m[3])),w="日月火水木金土"[d.getUTCDay()],hm=+m[4]*60+ +m[5];
    return `${+m[2]}/${+m[3]}（${w}）${hm>=960?"引け":`${m[4]}:${m[5]} 時点`}`}
  m=String(t||"").match(/^([A-Z][a-z]{2}) (\d+), (\d{4})/);
  if(m){const mo="JanFebMarAprMayJunJulAugSepOctNovDec".indexOf(m[1])/3,d=new Date(Date.UTC(+m[3],mo,+m[2]));return `${mo+1}/${+m[2]}（${"日月火水木金土"[d.getUTCDay()]}）引け`}
  return "";
};
function renderIdx(){
  const el=$("idx");
  if(!IDX||!IDX.indices||!IDX.indices.length){el.innerHTML=`<div class="soon">${IDX===false?"データを読み込めませんでした":"読み込み中…"}</div>`;return}
  const L=[...IDX.indices].sort((a,b)=>ORDER.indexOf(a.k)-ORDER.indexOf(b.k));
  const mx=Math.max(1,...L.map(x=>Math.abs(x.pct||0)));
  const asof=nyLabel((L.find(x=>x.k==="SPX")||L[0]).time);
  el.innerHTML=`<div class="ph"><h2>主要指数</h2><span class="asof">${asof}</span></div>`+L.map(x=>{
    const v=x.pct,c=v>0?"up":v<0?"dn":"",w=Math.abs(v||0)/mx*50;
    const bar=v==null?"":v>=0?`left:50%;width:${w}%;background:var(--up);border-radius:0 3px 3px 0`:`right:50%;width:${w}%;background:var(--dn);border-radius:3px 0 0 3px`;
    return `<div class="irow"><span class="nm">${x.ja}</span><span class="lv num">${x.price.toLocaleString("en-US",{minimumFractionDigits:x.k==="DJI"?0:2,maximumFractionDigits:x.k==="DJI"?0:2})}</span><span class="bar"><i style="${bar}"></i></span><span class="v num ${c}">${v==null?"-":(v>0?"+":v<0?"−":"±")+Math.abs(v).toFixed(2)+"%"}</span></div>`}).join("");
}
async function loadPaper(){
  try{const r=await fetch(PAPER+"?ts="+Date.now(),{cache:"no-store"});IDX=r.ok?await r.json():false}catch(e){IDX=false}
  renderIdx();
}
const SRC={mri:"../mri-app/data/mri.json",vix:"../mri-app/data/vix.json",tqqq:"../tqqq/data/tqqq.json",ndx:"../ndx-heatmap/data/ndx.json"};
async function load(){
  await Promise.all(Object.entries(SRC).map(async([k,u])=>{try{const r=await fetch(u+"?ts="+Date.now(),{cache:"no-store"});if(r.ok)DATA[k]=await r.json()}catch(e){}}));
  if(!Object.keys(DATA).length)$("empty").textContent="データを読み込めませんでした";
  renderPaper();
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b){state.tab=b.dataset.tab;store.set("tab",state.tab);renderTabs();window.scrollTo(0,0)}});
renderEd();renderTabs();renderApps();renderBooks();loadPaper();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){renderEd();loadPaper()}});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
