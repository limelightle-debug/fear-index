<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>
// shown inside the other apps' 他のアプリ / 書籍 tabs (suite.js): ?embed=apps or ?embed=books shows that tab alone
const EMBED=(location.search.match(/[?&]embed=(apps|books)\b/)||[])[1]||"";
if(EMBED){document.documentElement.classList.add("embed");
  document.addEventListener("click",e=>{const a=e.target.closest("a[href]");if(a&&!a.target)a.target="_top"},true)}
</script>
<title>恐怖新聞</title>
<meta name="description" content="恐怖新聞：毎朝の米国市場を、MRI と恐怖の目で一枚に（恐怖指数研究所）">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="恐怖新聞">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a1a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=LINE+Seed+JP:wght@400;700;800&display=swap">
<style>
:root{
  /* the same navy palette as the individual apps */
  --bg:#0a0a1a; --panel:#111127; --ink:#f2f2f7; --ink2:#c4c4d4; --muted:#8a8aa6; --line:#2a2a4a; --chip:#1a1a36; --accent:#7fa8ff;
  --l1:#1a6b2a; --l2:#4CAF50; --l3:#FFC107; --l4:#FF5722; --l5:#B71C1C;
  --up:#4CAF50; --dn:#F44336; --buy:#4CAF50; --sell:#F44336; --amber:#FF9800;
  --f-tick:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"LINE Seed JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
a{color:inherit}
.num{font-family:var(--f-tick);font-stretch:82%;font-variant-numeric:tabular-nums}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 0 8px}
.brand{display:flex;align-items:center;gap:10px}
.top{position:sticky}.top .langseg{position:absolute;right:0;top:14px;display:flex;background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}

.langseg button{appearance:none;border:0;background:transparent;color:var(--muted);font:700 12px/1 var(--f-body);letter-spacing:.04em;padding:7px 9px;border-radius:6px;cursor:pointer}
.langseg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.9),0 1px 2px rgba(0,0,0,.4)}
.avatar{width:44px;height:44px;border-radius:10px;flex:none;box-shadow:0 0 0 1px var(--line)}
h1{margin:0;font-size:21px;font-weight:800;letter-spacing:.04em;line-height:1.15}
.ed{font-size:12px;color:var(--muted);margin-top:2px}
.ed b{color:var(--ink2);font-weight:700}
.seg{display:flex;background:var(--chip);border-radius:8px;padding:3px;gap:2px;margin-top:10px}
.seg button{flex:1;appearance:none;border:0;background:transparent;color:var(--ink2);font:500 13.5px/1 var(--f-body);padding:9px 6px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.9),0 1px 2px rgba(0,0,0,.4);font-weight:700}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 8px}
.ph h2{margin:0;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--ink2)}
.ph .more{font-size:11.5px;color:var(--accent);text-decoration:none;white-space:nowrap}
.ph .asof{font-size:11.5px;color:var(--muted)}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
/* lead */
.lead{border-color:#3a3a66;background:linear-gradient(180deg,#16163a,var(--panel))}
.lead ul{margin:0;padding:0;list-style:none}
.lead li{position:relative;padding:5px 0 5px 14px;font-size:14px;line-height:1.55;color:var(--ink)}
.lead li::before{content:"";position:absolute;left:0;top:13px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.lead li b{font-family:var(--f-tick);font-stretch:82%;font-weight:700}
/* MRI */
.mri{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.lvl{display:inline-block;padding:4px 12px;border-radius:20px;font-size:14px;font-weight:700}
.big{font-family:var(--f-tick);font-stretch:82%;font-weight:700;font-size:46px;line-height:.95;font-variant-numeric:tabular-nums}
.chg{font-family:var(--f-tick);font-stretch:82%;font-size:12.5px;color:var(--ink2);text-align:right;margin-top:2px}
.rampw{position:relative;padding-top:24px;margin-top:10px}
.ramp{position:relative;height:16px;border-radius:8px;background:linear-gradient(to right,var(--l1) 10%,var(--l2) 30%,var(--l3) 50%,var(--l4) 70%,var(--l5) 90%)}
.ramp .mk{position:absolute;top:50%;width:6px;height:24px;background:#fff;border-radius:3px;box-shadow:0 0 10px rgba(255,255,255,.9);transform:translate(-50%,-50%)}
.ramp .tk{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:1px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.45);transform:translateX(-50%)}
.flag{--p:50%;position:absolute;top:0;transform:translateX(calc(-1 * var(--p)));white-space:nowrap;display:flex;align-items:center;height:19px;font-weight:800;font-size:10.5px;line-height:1;letter-spacing:.08em;color:#fff;padding:0 7px 0 8px;border-radius:5px;box-shadow:0 2px 6px rgba(0,0,0,.55);background:var(--c)}
.flag::after{content:"";position:absolute;left:var(--p);top:100%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--c)}
.flag b{font-family:var(--f-tick);font-stretch:82%;font-size:11px;margin-left:3px}
.flag.buy{--p:28%;--c:var(--buy)}.flag.sell{--c:var(--sell)}
.flag.on{outline:2px solid #fff}
.sigs{margin-top:12px;border-top:1px solid var(--line)}
.sg{display:grid;grid-template-columns:1fr auto 92px;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.sg:last-child{border-bottom:0;padding-bottom:0}
.sgn{font-weight:800;font-size:13px;white-space:nowrap}
.sgn small{display:block;font-weight:600;font-size:10.5px;color:var(--muted);margin-top:2px}
.tag{display:inline-block;font-style:normal;font-weight:800;font-size:9px;letter-spacing:.06em;color:#fff;background:var(--sell);border-radius:4px;padding:1px 5px;margin-right:5px}
.tag.buy{background:var(--buy)}
.lamps{display:flex;gap:7px;background:#07070f;border:1px solid var(--line);border-radius:16px;padding:5px 9px}
.lamps i{width:16px;height:16px;border-radius:50%;background:var(--c);opacity:.18}
.lamps i.on{opacity:1;box-shadow:0 0 9px 2px var(--c)}
.sgv{text-align:right;font-family:var(--f-tick);font-stretch:82%;font-size:12px;color:var(--ink2);white-space:nowrap;line-height:1.3}
.sgv b{display:block;font-family:var(--f-body);font-stretch:100%;font-weight:600;font-size:10px;color:var(--muted)}
/* key figures */
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:#0d0d22;border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.kv span{display:block;font-size:10.5px;color:var(--muted);white-space:nowrap}
.kv b{display:block;font-family:var(--f-tick);font-stretch:82%;font-weight:700;font-size:20px;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap}
.kv small{display:block;font-family:var(--f-tick);font-stretch:82%;font-size:11.5px;color:var(--ink2);white-space:nowrap}
.up,.kv .up{color:var(--up)}.dn,.kv .dn{color:var(--dn)}
.kv b em{font-style:normal}.kv b .sl{font-size:14px;color:var(--muted)}
.movers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.movers h3{margin:0 0 4px;font-size:11px;font-weight:700;color:var(--muted)}
.movers ol{margin:0;padding:0;list-style:none}
.movers li{display:flex;justify-content:space-between;gap:6px;padding:4px 0;border-top:1px solid var(--line);font-family:var(--f-tick);font-stretch:85%;font-size:13px}
.movers li span{color:var(--ink2)}
.bar2{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:10px;background:var(--chip)}
.bar2 i{display:block;height:100%}
.bar2l{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:3px}
/* app map */
.soon{padding:28px 0;text-align:center;color:var(--muted)}
/* morning paper, front page: headline, the indices as tiles coloured by the day's move, then the article; fits one screen */
.head{font-size:20px;font-weight:800;line-height:1.3;letter-spacing:.02em;margin:0 0 2px}
.head .h2b{display:block;font-size:16px;margin-top:1px}
.sub{font-size:12.5px;color:var(--ink2);margin:0 0 8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.tile{border-radius:9px;padding:7px 10px 8px;color:#fff;min-width:0}
.tile .tn{font-size:12px;font-weight:700;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tb{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-top:1px}
.tile .tp{font-family:var(--f-tick);font-stretch:82%;font-weight:700;font-size:22px;line-height:1.05;font-variant-numeric:tabular-nums}
.tile .tl{font-family:var(--f-tick);font-stretch:85%;font-size:11.5px;opacity:.85;font-variant-numeric:tabular-nums;white-space:nowrap}
/* value tiles (currencies, commodities): the level large, the change under it */
.tile .tv{font-family:var(--f-tick);font-stretch:82%;font-weight:700;font-size:25px;line-height:1.1;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .tv small{font-size:13px;font-weight:600;margin-left:2px;opacity:.85}
.tile .tc{font-family:var(--f-tick);font-stretch:85%;font-size:13px;font-weight:700;margin-top:1px;opacity:.95;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .tc span{font-weight:500;opacity:.8;margin-left:6px}
.ctiles .tile:last-child:nth-child(odd){grid-column:1/-1}
.tile.hero{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:10px 12px}
.tile.hero .tn{font-size:14px}
.tile.hero .tl{display:block;font-size:13px;margin-top:2px}
.tile.hero .tp{font-size:40px;line-height:1}
.story{margin-top:10px}
/* page 2: MRI - gauge, the last 3 months, and the institute's view */
.mrihead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mrihead .big{font-size:42px}
.mrichart{margin-top:12px}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:10px}
.score{border-radius:9px;padding:7px 10px 8px;min-width:0}
.score .sn{font-size:12px;font-weight:700;opacity:.9}
.score .sv{font-family:var(--f-tick);font-stretch:82%;font-weight:700;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.score .sr{font-family:var(--f-tick);font-stretch:85%;font-size:11.5px;opacity:.85;font-variant-numeric:tabular-nums}
.mrichart svg{display:block;width:100%;overflow:visible}
.mrichart text{font-family:var(--f-tick);font-stretch:85%;font-size:10px;fill:var(--muted)}
.sigline{font-size:12px;color:var(--ink2);margin-top:8px}
.sigline em{font-style:normal;font-weight:800;font-size:10px;color:#fff;background:var(--sell);border-radius:4px;padding:1px 5px;margin-right:5px}
/* the paper's first article: the day's confirmed MRI as in the MRI app, and the comment on it */
.mtop .mt{display:flex;align-items:baseline;gap:10px;font-size:26px;font-weight:800;letter-spacing:.02em;line-height:1.15;padding-bottom:9px;border-bottom:1px solid var(--line)}
.mtop .mts{font-size:12.5px;font-weight:500;letter-spacing:0;color:var(--muted)}
.mtop .mhd{margin:0}
.mtop .mrow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:12px}
.mtop .mrl{font-size:15px;font-weight:600;color:var(--ink2);letter-spacing:.03em;white-space:nowrap}
.mtop .mrow .lvl{margin-top:8px;font-size:18px;padding:5px 15px}
.mtop .mv{text-align:right}.mtop .mv .big{font-size:44px}.mtop .mv .ml{font-family:var(--f-tick);font-size:18px;font-weight:700;color:var(--ink2);margin-right:8px}
.mtop .rlab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:6px}
.mtop .cm{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.mtop .cm b{font-size:11.5px;font-weight:700;color:var(--accent)}
.mtop .cm p{margin:3px 0 0;font-size:14px;line-height:1.64;text-indent:1em}
.view{margin-top:10px;border-top:1px solid var(--line);padding-top:9px}
.view b{font-size:11.5px;font-weight:700;color:var(--accent)}
.view p{margin:3px 0 0;font-size:14px;line-height:1.64;text-indent:1em}
/* 心: the column at the foot of the front page, like a paper's daily column (from the Mind app) */
.kokoro{border-top:3px double var(--line);border-bottom:3px double var(--line);border-radius:4px;background:linear-gradient(180deg,#14143a,var(--panel))}
.kokoro .kh{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.kokoro .kh b{font-size:20px;font-weight:800;letter-spacing:.2em}
.kokoro .kh span{font-size:12px;color:var(--muted)}
.kokoro .kh span em{font-style:normal;font-weight:700;color:var(--ink2)}
.kokoro .kw{margin:10px 0 0;font-size:15px;font-weight:700;line-height:1.75}
.kokoro .kb{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.kokoro .kb small{display:block;font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.06em}
.kokoro .kb strong{display:block;font-size:14px;margin-top:2px}
.kokoro .kb p{margin:2px 0 0;font-size:13px;line-height:1.65;color:var(--ink2)}
.kokoro .kl{display:block;text-align:right;margin-top:8px;font-size:12px;color:var(--accent);text-decoration:none}
/* the day's other news, one line each with a tag */
.nws{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:baseline}
.nws b{font-size:11px;font-weight:700;color:var(--accent);border:1px solid rgba(127,168,255,.45);border-radius:999px;padding:1px 8px;white-space:nowrap;justify-self:start}
.nws p{margin:0;font-size:14px;line-height:1.6}
/* the numbers behind the story: rates, currencies, commodities, one row each */
.lq{display:grid;grid-template-columns:minmax(0,1fr) auto 70px 70px;align-items:baseline;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.lq.hd{border-top:0;padding:0 0 3px}.lq.hd span{font-size:10.5px;font-weight:700;color:var(--muted);text-align:right}
.lq .k{font-size:13.5px;color:var(--ink2);white-space:nowrap}.lq .k small{display:block;font-size:10.5px;color:var(--muted);margin-top:1px}
.lq .v{font-family:var(--f-tick);font-stretch:82%;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.lq .v small{font-family:var(--f-body);font-size:11px;font-weight:600;margin-left:1px}
.lq .c{font-family:var(--f-tick);font-stretch:85%;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.lq .c.up{color:#5fd08e}.lq .c.dn{color:#ff7b7b}
.mtab{margin-top:10px}
.mtab .lq{grid-template-columns:minmax(0,1fr) auto 64px}
.lq .k{overflow:hidden;text-overflow:ellipsis}
.mtab.lq4 .lq{grid-template-columns:minmax(0,1fr) auto 58px 58px;gap:6px}
.lsrc{margin-top:8px;font-size:11.5px;color:var(--muted)}
.ng{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.08em;margin:12px 0 2px}
.ng:first-of-type{margin-top:2px}
.nr{display:grid;grid-template-columns:minmax(0,1fr) auto 92px;align-items:baseline;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.nr .k{font-size:13.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nr .v{font-family:var(--f-tick);font-stretch:82%;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.nr .c{font-family:var(--f-tick);font-stretch:85%;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.nr .c.up{color:#5fd08e}.nr .c.dn{color:#ff7b7b}
.nr .k .nest{font-family:var(--f-body);font-style:normal;font-size:9.5px;font-weight:700;color:#ffb547;border:1px solid #ffb54766;border-radius:999px;padding:0 5px;margin-left:6px;vertical-align:1px}
.nr .k small{font-family:var(--f-tick);font-size:10.5px;color:var(--muted);margin-left:6px}
.nr .tag{font-family:var(--f-body);font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px}
/* rates: 3M, 2Y, 10Y, 30Y, the spreads and the curve's state; the curve now / 3 / 6 months ago; both spreads over 5 years */
.rsum{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.rsum div{background:var(--chip);border-radius:10px;padding:8px 9px 7px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.rsum b{display:block;font-family:var(--f-tick);font-stretch:82%;font-size:22px;font-weight:700;color:var(--ink);letter-spacing:0;margin-top:1px;font-variant-numeric:tabular-nums}
.rsum small{display:block;font-family:var(--f-tick);font-stretch:85%;font-size:11px;font-weight:600;margin-top:1px;font-variant-numeric:tabular-nums}
.rsum small.u{color:#ff8a84}.rsum small.d{color:#7fd6a4}
.rstate{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--ink2)}
.rstate .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px 3px 8px;border:1px solid}
.rstate .pill i{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.rstate .sp b{font-family:var(--f-tick);font-stretch:82%;font-size:15px;color:var(--ink);margin-left:4px}
.rstate .sp .path{font-style:normal;font-size:11.5px;font-weight:700;margin-left:6px}
.rstate .note{width:100%;color:var(--muted);font-size:11.5px}
.rchart{margin-top:6px}
.rpseg{display:inline-flex;margin:0;padding:2px;gap:1px;border-radius:7px}.rpseg button{flex:none;font-size:11px;font-weight:600;padding:4px 10px;border-radius:5px;letter-spacing:0}
.rx2{margin-top:6px}.rx2 .pre{display:block;font-style:normal;font-size:10.5px;font-weight:600;color:var(--muted);opacity:.85;margin-bottom:1px}.rx2 div{letter-spacing:0;white-space:nowrap}
.rx2 em{display:inline-block;margin-top:4px;font-family:var(--f-body);font-style:normal;font-size:9.5px;font-weight:700;color:#ffb547;border:1px solid #ffb54766;border-radius:999px;padding:0 6px;line-height:1.5}
.rxn{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.6}
.rchart svg{display:block;width:100%;overflow:visible}
.rchart text{font-family:var(--f-tick);font-stretch:85%;font-size:10px;fill:var(--muted)}
.rcap{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:28px;margin-top:16px;font-size:12px;font-weight:700;color:var(--ink2);letter-spacing:.04em}
.rkey.rleg{margin-top:4px}
.rkey{display:flex;gap:10px;font-size:10.5px;font-weight:600;color:var(--muted)}
.rkey i{display:inline-block;width:12px;height:0;border-top:2px solid;vertical-align:middle;margin-right:4px}
/* page 3: how afraid the market is - the scene (from Mind), then VIX, MRI and SKEW */
.scene{display:flex;align-items:baseline;gap:8px;margin:2px 0 2px}
.scene b{font-size:24px;font-weight:800;letter-spacing:.04em}
.scene span{font-size:12px;color:var(--muted)}
.scenet{font-size:13px;line-height:1.6;color:var(--ink2);margin:2px 0 10px}
.meters{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}
.meter{background:var(--chip);border-radius:9px;padding:8px 10px;min-width:0}
.meter .mn{font-size:12px;font-weight:700;color:var(--ink2)}
.meter .mv{font-family:var(--f-tick);font-stretch:82%;font-weight:700;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.meter .ms{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4}
.meter .pill{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;margin-top:5px;white-space:nowrap}
.tline{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-top:8px}
.tline a{color:var(--accent);text-decoration:none;white-space:nowrap}
/* the issue: date and time the paper came out, large, in its own panel on top */
.issue{padding:10px 14px 10px 10px}.issue .irow{display:flex;align-items:center;gap:12px}
.issue .pts{list-style:none;margin:10px 0 0 4px;padding:9px 0 0;border-top:1px solid var(--line)}
.issue .pts li{position:relative;padding-left:15px;font-size:15px;font-weight:700;line-height:1.55;margin-top:3px}
.issue .pts li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--sell)}
/* the title piece: the institute's picture with 恐怖新聞 across it, as on a paper's front page */
.issue .mast{display:block;width:150px;height:58px;flex:none;border-radius:9px}
.issue .ib{flex:1;display:flex;flex-direction:column;align-items:flex-end;gap:5px;min-width:0}
.issue .ib .id{font-size:28px;white-space:nowrap}.issue .ib .id small{font-size:16px}
@media (max-width:400px){.issue .mast{width:128px;height:49.5px}.issue .ib .id{font-size:26px}.issue .ib .id small{font-size:15px}}
.issue .ib .it{display:flex;align-items:baseline;gap:6px}.issue .ib .it b{font-size:16px}.issue .ib .it span{margin-top:0}
.issue .id{font-size:26px;font-weight:800;letter-spacing:.02em;line-height:1.1}
.issue .id small{font-size:17px;font-weight:700;margin-left:2px}
.issue .it{text-align:right;line-height:1.1}
.issue .it b{font-family:var(--f-tick);font-stretch:82%;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.issue .it span{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
.story p{margin:0;font-size:14px;line-height:1.64;text-indent:1em;text-align:left;color:var(--ink)}
.story .src{margin-top:6px;font-size:11.5px;color:var(--muted)}
.story .src a{color:var(--muted)}
.up{color:var(--up)}.dn{color:var(--dn)}
.layer{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:#0d0d22}
.lh{display:flex;align-items:center;gap:8px;margin:0 0 4px}
.lh b{font-size:13px;letter-spacing:.06em}
.lh span{font-size:11px;color:var(--muted)}
.node{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);text-decoration:none}
.lh+.node{border-top:0}
.node img{width:44px;height:44px;border-radius:10px;flex:none;box-shadow:0 0 0 1px var(--line)}
.node b{display:block;font-size:14.5px}
.node span{display:block;font-size:12px;color:var(--muted);line-height:1.45}
.node em{margin-left:auto;font-style:normal;color:var(--accent);font-size:18px}
.node.home{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:10px;background:#0d0d22}
.arrow{text-align:center;color:var(--accent);font-size:18px;line-height:1;padding:5px 0}
.soonl{margin-top:12px;border-style:dashed;background:transparent}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:4px 0 2px}
.chips span{font-size:12px;color:var(--ink2);background:var(--chip);border-radius:999px;padding:3px 10px}
/* apps and books */
.app{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);text-decoration:none}
.app:first-of-type{border-top:0;padding-top:2px}
.app img{width:52px;height:52px;border-radius:12px;flex:none;box-shadow:0 0 0 1px var(--line)}
.app b{display:block;font-size:15px}
.app span{display:block;font-size:12px;color:var(--muted);line-height:1.45}
.app em{margin-left:auto;font-style:normal;color:var(--accent);font-size:18px}
.tree{position:relative;margin:2px -14px 10px;padding-top:6%;background:#070712;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
/* room above 空; the title links sit on .tin, so their % boxes still match the picture */
.tin{position:relative}.tree img{display:block;width:100%;height:auto}
.tree a{position:absolute;border-radius:6px}
.tree a:active{background:rgba(127,168,255,.25)}
.book .ly{display:inline-block;font-style:normal;font-size:10px;font-weight:700;color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:0 6px;margin-bottom:2px}
.lh .kan{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border:1.5px solid var(--ink);border-radius:50%;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-size:14px;margin-right:2px}
.node .ch{font-style:normal;font-weight:400;font-size:11px;color:var(--muted);margin-left:8px;white-space:nowrap}
.bmap{position:relative}
.bmap.solo::before{display:none}
.bmap::before{content:"";position:absolute;left:22px;top:32px;bottom:32px;width:2px;background:var(--line)}
.book{position:relative;display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);text-decoration:none}
.book em{margin-left:auto;font-style:normal;color:var(--accent);font-size:18px}
.book .cv{position:relative;z-index:1}
.book:first-of-type{border-top:0;padding-top:2px}
.book .cv{width:44px;height:64px;border-radius:4px;flex:none;object-fit:cover;background:linear-gradient(160deg,#2a1020,#0b0b18);box-shadow:0 0 0 1px var(--line);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--muted);text-align:center;line-height:1.2;padding:3px}
.book b{display:block;font-size:15px}
.book span{display:block;font-size:12px;color:var(--accent)}
.foot{margin-top:18px;text-align:center;font-size:11px;color:var(--muted)}

/* the last panel: why each panel is in the paper and what to look at, in the paper's order */
.guide dl{margin:0}.guide dt{font-size:12px;font-weight:700;color:var(--ink);letter-spacing:.04em;margin-top:12px}.guide dt:first-child{margin-top:2px}
.guide dd{margin:3px 0 0;font-size:13.5px;line-height:1.64;color:var(--ink2)}
/* embedded in another app: just the tab, no header, footer or side padding of its own */
html.embed .top,html.embed .foot,html.embed body::before{display:none}html.embed .wrap{padding:0;max-width:none}html.embed body{background:transparent}
/* ---- design system (applied last): type scale, change colours, pills ----
   numbers: hero 44 (MRI) / tiles and cards 24 / list rows 18 / small 13, all Archivo
   text: headline 20 / body 14 / panel title 13 / subhead 12 / meta 11.5 / pill 10.5
   change colours: prices +green −red; fear and rates ▲red ▼green */
:root{--pos:#5fd08e;--neg:#ff7b7b;--est:#ffb547}
.tile .tp,.tile .tv,.rsum b{font-size:24px}
.rsum small.u,.nr .c.rup{color:var(--neg)}.rsum small.d,.nr .c.rdn{color:var(--pos)}
.nr .c.up{color:var(--pos)}.nr .c.dn{color:var(--neg)}
.ng{font-size:12px;font-weight:700;color:var(--ink2);letter-spacing:.04em;margin:16px 0 4px}.ng:first-of-type{margin-top:4px}
.ph h2{font-size:13px}.ph .asof,.rstate .note,.rxn,.story .src{font-size:11.5px}
.nws b,.nr .tag,.rx2 em,.nr .k .nest{font-family:var(--f-body);font-style:normal;font-size:10.5px;font-weight:700;line-height:1.5;border-radius:999px;padding:0 8px;letter-spacing:.02em}
.nws b{border:1px solid rgba(127,168,255,.45);background:rgba(127,168,255,.1)}
.rx2 em,.nr .k .nest{color:var(--est);border:1px solid #ffb54766;background:#ffb5471a}
.nr .tag{border:1px solid currentColor}
.rstate .pill{font-size:11.5px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <img class="avatar" src="icons/app.png" alt="" width="44" height="44">
      <div>
        <h1 id="ttl">恐怖新聞</h1>
        <div class="ed" id="ed">読み込み中…</div>
      </div>
    </div>
    <div class="langseg" id="lang" role="group" aria-label="Language"><button type="button" data-lang="ja">JP</button><button type="button" data-lang="en">EN</button></div>
    <div class="seg" id="tabs" role="group" aria-label="表示">
      <button type="button" data-tab="paper">恐怖新聞</button>
      <button type="button" data-tab="apps">アプリ</button>
      <button type="button" data-tab="books">書籍</button>
    </div>
  </div>

  <div id="t-paper">
    <section class="panel issue" id="issue"></section>
    <section class="panel mtop" id="mritop" hidden></section>
    <section class="panel" id="idx"><div class="soon">読み込み中…</div></section>
    <section class="panel" id="news" hidden></section>
    <section class="panel" id="rates" hidden></section>
    <section class="panel" id="cmdty" hidden></section>
    <section class="panel kokoro" id="kokoro" hidden></section>
    <section class="panel" id="gdp" hidden></section>
    <section class="panel" id="infl" hidden></section>
    <section class="panel" id="jobs" hidden></section>
    <section class="panel" id="liq" hidden></section>
    <section class="panel" id="nums" hidden></section>
    <section class="panel guide" id="guide"></section>
  </div>

  <div id="t-apps" hidden>
    <section class="panel" id="apps"></section>
    <section class="panel books" data-head="ph" data-books="vix:parts"></section>
  </div>

  <div id="t-books" hidden>
    <section class="panel" id="books"></section>
    <section class="panel" id="books-en"></section>
  </div>

  <div class="foot">© 恐怖指数研究所 Gold Locks</div>
</div>

<script src="books.js"></script>
<script src="../mind/engine.js"></script>
<script src="../mind/words.js"></script>
<script>
const APP_VER="fi-v108";
const $=id=>document.getElementById(id);
// language, shared with the other apps (localStorage "lang"); ?lang= when shown inside another app's アプリ / 書籍 tab
let LANG=(()=>{const q=(location.search.match(/[?&]lang=(ja|en)\b/)||[])[1];if(q)return q;try{const v=localStorage.getItem("lang");if(v==="ja"||v==="en")return v}catch(e){}return /^ja/i.test(navigator.language||"")?"ja":"en"})();
document.documentElement.lang=LANG;
const EN=()=>LANG==="en",tx=(ja,en)=>EN()?en:ja;
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const WD=n=>(EN()?["Sun","Mon","Tue","Wed","Thu","Fri","Sat"]:[..."日月火水木金土"])[n];
const dayLab=(m,d,w)=>EN()?`${WD(w)} ${MON[m-1]} ${d}`:`${m}/${d}（${WD(w)}）`;   // m 1-12, w weekday 0-6
const wdOf=(y,m,d)=>new Date(Date.UTC(y,m-1,d)).getUTCDay();
const CLOSE=()=>tx("米国市場引け","US close");
// the day's article in the reader's language (paper.json "en"), falling back to the Japanese
const SP=(st,k)=>st&&(EN()&&st.en&&st.en[k]!=null?st.en[k]:st[k]);
const BASE="https://limelightle-debug.github.io";
const APPS=[
  ["mri","Market Risk Index","VIX・SKEW・CAPE から天井と底を推定する MRI と、そのシグナル",`${BASE}/mri-app/`,"icons/app-mri.png"],
  ["vix","VIX Events","VIX イベントの記録と周期",`${BASE}/mri-app/vix/`,"icons/app-vix.png"],
  ["tqqq","TQQQ","TQQQ の価格、高値からの下落、年次の成績",`${BASE}/tqqq/`,"icons/app-tqqq.png"],
  ["mind","Mind","毎朝の局面と、今大切な言葉、陥りやすいバイアス",`${BASE}/mind/`,"icons/app-mind.png"],
  ["ndx","Nasdaq 100","構成銘柄のヒートマップ、騰落率、組入比率",`${BASE}/ndx-heatmap/`,"icons/app-ndx.png"]];
// the books in the order of the institute's book map, each linking to its Amazon page
// [title, Amazon, cover, layer in the tree, the title's box on the tree image in % (left, top, width, height)]
const BOOKS=[["VIXの声を聴け","https://amzn.asia/d/0hrhh1Ny","icons/book-vix.jpg","樹",[34,36,32,7]],["Listen to VIX","https://amzn.asia/d/07rtXhVo","icons/book-vix-en.jpg","",null,"en"],["金利の重力","https://amzn.asia/d/04cgLpEq","icons/book-kinri.jpg","地",[40.5,60,19.5,6.5]],
  ["帳簿と物差し","https://amzn.asia/d/03aL6HY1","icons/book-chobo.jpg","根",[25.5,73,21,6.5]],["失敗の魔術師","https://amzn.asia/d/0hWKU73R","icons/book-shippai.jpg","根",[56,73,21,6.5]],
  ["兵法に学べ","https://amzn.asia/d/02BQOi5d","icons/book-heiho.jpg","根",[25.5,81.5,18,6.5]],["相場のアノマリーを斬る","https://amzn.asia/d/0boQWl0D","icons/book-anomaly.jpg","根",[49,81.5,36,6.5]]];
const store={get:(k,d)=>{try{return localStorage.getItem("fi."+k)??d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem("fi."+k,v)}catch(e){}}};
// the MRI tab is gone (MRI is its own app, from the アプリ tab): a stored "mri" opens the paper
const state={tab:EMBED||store.get("tab","paper")};if(!["paper","apps","books"].includes(state.tab))state.tab="paper";
const DATA={};

const pc=(v,d=1)=>`${v>=0?"+":"−"}${Math.abs(v*100).toFixed(d)}%`;
const sg=(v,d=2)=>`${v>=0?"+":"−"}${Math.abs(v).toFixed(d)}`;
const ymd=n=>{const s=String(n);return`${s.slice(0,4)}/${+s.slice(4,6)}/${+s.slice(6,8)}`};
const md=n=>{const s=String(n);return`${+s.slice(4,6)}/${+s.slice(6,8)}`};
const LEVELS=[[.2,"Very Low","--l1","#fff"],[.4,"Low","--l2","#fff"],[.6,"Medium","--l3","#000"],[.8,"High","--l4","#fff"],[2,"Very High","--l5","#fff"]];
const level=v=>LEVELS.find(l=>v<l[0]);

/* ---------- signals: the same rules as the MRI app ---------- */
// lights stay on (at the highest level reached) until reset; judged on the values as computed at the time
// (pit) and on signals certified by hand; technical bubble = CAPE score alone
function signals(D,lastN){
  let R=(D.daily||[]).filter(r=>r[0]>=20180101&&r[0]<=lastN);
  const PIT=D.pit||{},CERT={};(D.certified||[]).forEach(c=>{CERT[c.signal+c.date]=Math.max(CERT[c.signal+c.date]||0,c.level)});
  R=R.map(r=>{const q=PIT[r[0]];if(!q)return r;const x=r.slice();x[6]=q[0];x[7]=q[1];return x});
  const latch=(key,lvl,reset)=>{const E=[];let cur=null;R.forEach((r,i)=>{if(cur&&reset(r)){cur.off=r[0];cur=null}const l=Math.max(lvl(r),CERT[key+r[0]]||0);
    if(l>(cur?cur.lv:0)){if(!cur){cur={on:r[0],lv:0,off:null};E.push(cur)}cur.lv=l}});return E};
  const up=(v,a)=>v>=a[2]?3:v>=a[1]?2:v>=a[0]?1:0,dn=(v,a)=>v<=a[2]?3:v<=a[1]?2:v<=a[0]?1:0;
  return[["tbub","テクニカルバブル","sell","CAPE 単独",latch("tbub",r=>up(r[6],[.841345,.97725,.99865]),r=>r[6]<=.5)],
    ["sell","SELL","sell","MRI",latch("sell",r=>up(r[7],[.8,.85,.9]),r=>r[7]<=.5)],
    ["buy","BUY","buy","MRI",latch("buy",r=>dn(r[7],[.08,.06,.04]),r=>r[7]>=.5)]].map(([k,name,side,basis,E])=>{
      const e=E[E.length-1],on=!!(e&&e.off==null);return{k,name,side,basis,lv:on?e.lv:0,on,since:on?e.on:null,reset:e&&!on?e.off:null}});
}

/* ---------- sections ---------- */
function renderMRI(){
  const D=DATA.mri;if(!D){$("p-mri").innerHTML="";return null}
  // the morning edition: the last confirmed day (the realtime day, if any, is left to the MRI app)
  const rows=D.daily.filter(r=>r[0]!==D.liveDay),r=rows[rows.length-1],p=rows[rows.length-2];
  const m=r[7],lv=level(m),S=signals(D,r[0]);
  const C=["#4CAF50","#FF9800","#F44336"];
  $("p-mri").innerHTML=`<div class="ph"><h2>MRI</h2><a class="more" href="${APPS[0][3]}">MRI アプリで詳しく ›</a></div>
    <div class="mri"><div><div class="ed" style="margin:0 0 6px">米国 ${md(r[0])} 確定値</div><span class="lvl" style="background:var(${lv[2]});color:${lv[3]}">${lv[1]}</span></div>
      <div><div class="big" style="color:var(${lv[2]})">${(m*100).toFixed(2)}</div><div class="chg">前日比 ${sg((m-p[7])*100)}pt</div></div></div>
    <div class="rampw"><div class="flag buy${m<=.08?" on":""}" style="left:8%">BUY<b>8</b></div><div class="flag sell${m>=.8?" on":""}" style="left:80%">SELL<b>80</b></div>
      <div class="ramp"><div class="tk" style="left:8%"></div><div class="tk" style="left:80%"></div><div class="mk" style="left:${Math.min(Math.max(m*100,1),99)}%"></div></div></div>
    <div class="sigs">${S.map(s=>`<div class="sg"><div class="sgn">${s.name}<small><em class="tag ${s.side}">${s.side.toUpperCase()}</em>${s.basis}</small></div>
      <div class="lamps">${C.map((c,i)=>`<i class="${i<s.lv?"on":""}" style="--c:${c}"></i>`).join("")}</div>
      <div class="sgv">${s.on?`<b>点灯 Lv. ${s.lv}</b>${ymd(s.since)}`:s.reset?`<b>リセット</b>${ymd(s.reset)}`:"–"}</div></div>`).join("")}</div>`;
  return{r,p,m,lv,S};
}
function renderVIX(){
  const V=DATA.vix;if(!V){$("p-vix").innerHTML="";return null}
  const q=V.quote||{},px=q.price,prev=q.prevClose;
  // the last VIX event and the months since it began
  const ev=(V.events||[]).slice(-1)[0],info=ev&&V.eventInfo?V.eventInfo[String(ev)]:null;
  const now=new Date(),evd=info?String(info.day):null;
  const months=evd?(now.getFullYear()*12+now.getMonth())-(+evd.slice(0,4)*12+(+evd.slice(4,6)-1)):null;
  $("p-vix").innerHTML=`<div class="ph"><h2>VIX</h2><a class="more" href="${APPS[1][3]}">VIX アプリで詳しく ›</a></div>
    <div class="kv"><div><span>VIX ${q.time?md(q.time.replace(/-/g,"").slice(0,8)):""} 終値</span><b>${px!=null?px.toFixed(2):"–"}</b><small class="${px<prev?"up":"dn"}">${px!=null&&prev?sg(px-prev):""}</small></div>
      <div><span>前回の VIX イベント</span><b>${evd?`${evd.slice(0,4)}/${+evd.slice(4,6)}`:"–"}</b><small>${info?`ピーク ${info.peak}`:""}</small></div>
      <div><span>そこからの経過</span><b>${months!=null?`${months}<em class="sl"> ヶ月</em>`:"–"}</b><small>${V.events?`1997年以降 ${V.events.length} 回`:""}</small></div></div>`;
  return{px,prev,months};
}
function renderTQQQ(){
  const T=DATA.tqqq;if(!T){$("p-tqqq").innerHTML="";return null}
  const d=T.daily||[],last=d[d.length-1],prev=d[d.length-2];if(!last)return null;
  const ath=Math.max(...d.map(r=>r[4])),dd=last[4]/ath-1,ch=last[4]/prev[4]-1;
  const y0=d.filter(r=>Math.floor(r[0]/10000)<Math.floor(last[0]/10000)).slice(-1)[0],ytd=y0?last[4]/y0[4]-1:null;
  $("p-tqqq").innerHTML=`<div class="ph"><h2>TQQQ</h2><a class="more" href="${APPS[2][3]}">TQQQ アプリで詳しく ›</a></div>
    <div class="kv"><div><span>${md(last[0])} 終値</span><b>${last[4].toFixed(2)}</b><small class="${ch>=0?"up":"dn"}">${pc(ch,2)}</small></div>
      <div><span>上場来高値から</span><b class="${dd>=-.001?"up":"dn"}">${pc(dd)}</b><small>高値 ${ath.toFixed(2)}</small></div>
      <div><span>年初来</span><b class="${ytd>=0?"up":"dn"}">${ytd!=null?pc(ytd):"–"}</b><small>QQQ ${last[6]!=null?last[6].toFixed(2):""}</small></div></div>`;
  return{last,ch,dd};

function renderNDX(){

function liqCharts(){
  const el=$("liq"),W=Math.max(260,el.clientWidth-28),F=LQ.fed,R=LQ.rrp,M=LQ.m2;let h="";
  if(F&&F.hist&&F.hist.length>4){h+=`<div class="rcap"><span>${tx("FRB総資産と準備預金（兆ドル）","Fed assets and reserves ($T)")}</span></div>${legend([[tx("総資産","Total assets"),"#7fa8ff"],[tx("準備預金","Reserves"),"#7fd6a4"]])}`
    +tsChart([{c:"#7fa8ff",p:F.hist.map(q=>[dms(q[0]),q[1]/1e6])},{c:"#7fd6a4",p:F.hist.map(q=>[dms(q[0]),q[2]/1e6])}],W,{H:140,dec:2})}
  if(R&&R.hist&&R.hist.length>20)h+=`<div class="rcap"><span>${tx("リバースレポ（10億ドル）","Overnight reverse repo ($B)")}</span></div>`+tsChart([{c:"#ffb547",p:R.hist.map(q=>[dms(q[0]),q[1]]),w:1.3}],W,{H:110,dec:0});
  if(M&&M.hist){const yy=yoyOf(M.hist);h+=yy.length>=12?`<div class="rcap"><span>${tx("M2 前年比","M2, change on a year")}</span></div>`+tsChart([{c:"#b59cff",p:toT(yy)}],W,{H:110,unit:"%",zero:true}):`<div class="rcap"><span>${tx("M2（兆ドル）","M2 ($T)")}</span></div>`+tsChart([{c:"#b59cff",p:toT(M.hist.map(([k,v])=>[k,v/1e3]))}],W,{H:110,dec:1})}
  return h;
}
function renderLiq(){
  const el=$("liq");
  if(!LQ||!(LQ.fed||LQ.m2||LQ.rrp)){el.hidden=true;return}
  const F=LQ.fed,R=LQ.rrp,M=LQ.m2,en=EN();
  // amounts in billions: trillions for levels, billions (億ドル in Japanese) for changes
  const lvl=b=>en?`$${(b/1e3).toFixed(2)}<small>T</small>`:`${(b/1e3).toFixed(2)}<small>兆ドル</small>`;
  const lvlB=b=>b>=1e3?lvl(b):en?`$${b.toFixed(1)}<small>B</small>`:`${(b*10).toFixed(b<10?1:0)}<small>億ドル</small>`;
  const chg=b=>{const a=Math.abs(b),sg=b>0?"+":b<0?"−":"±";return en?`${sg}$${a>=100?Math.round(a):a.toFixed(1)}B`:`${sg}${(a*10).toLocaleString("en-US",{maximumFractionDigits:a*10>=100?0:1})}億`};
  const pc=v=>`${v>0?"+":v<0?"−":"±"}${Math.abs(v).toFixed(1)}%`,cl=v=>v>0?"up":v<0?"dn":"";
  const md2=x=>{const [,m,d]=x.split("-").map(Number);return `${m}/${d}`};
  const row=(k,sub,v,c1,c1c,c2,c2c)=>`<div class="lq"><span class="k">${k}<small>${sub}</small></span><span class="v">${v}</span><span class="c ${c1c||""}">${c1}</span><span class="c ${c2c||""}">${c2}</span></div>`;
  let rows="",h1="",h2="";
  if(F){const [t,tw,ty]=F.total.map(x=>x/1e3),[r,rw,ry]=F.reserves.map(x=>x/1e3),wk=md2(F.week);
    rows+=row(tx("FRB総資産","Fed total assets"),tx(`${wk}（水）`,`Wed ${wk}`),lvl(t),chg(tw),cl(tw),chg(ty),cl(ty))
      +row(tx("準備預金","Reserve balances"),tx(`${wk} までの週平均`,`week to ${wk}`),lvl(r),chg(rw),cl(rw),chg(ry),cl(ry));
    h1=en?`Reserves $${(r/1e3).toFixed(2)}T, ${chg(rw)} on the week`:`準備預金 ${(r/1e3).toFixed(2)}兆ドル`;
    h2=en?"":`前週比${chg(rw)}ドル`}
  if(R&&R.hist&&R.hist.length){const h=R.hist,v=h[h.length-1][1],p=h.length>1?h[h.length-2][1]:null,ya=String(+R.date.slice(0,4)-1)+R.date.slice(4),y=h[0][0]<=ya?h.find(x=>x[0]>=ya):null;
    rows+=row(tx("リバースレポ","Overnight reverse repo"),tx(`${md2(R.date)} 翌日物`,`${md2(R.date)}`),lvlB(v),p==null?"":chg(v-p),p==null?"":cl(v-p),y?chg(v-y[1]):"",y?cl(v-y[1]):"")}
  if(M&&M.hist&&M.hist.length>=13){const h=M.hist,v=h[h.length-1][1],mm=(v/h[h.length-2][1]-1)*100,yy=(v/h[h.length-13][1]-1)*100,mo=+M.month.slice(5);
    rows+=row("M2",tx(`${mo}月 季節調整済み`,`${MON[mo-1]} (SA)`),lvl(v),pc(mm),cl(mm),pc(yy),cl(yy));
    h2+=(h2?(en?", ":"、"):"")+(en?`M2 ${pc(yy)} on the year`:`M2は前年比${pc(yy)}`)}
  if(!h1&&h2){h1=h2;h2=""}
  el.hidden=false;
  el.innerHTML=`<div class="ph"><h2>${tx("ドル流動性","Dollar liquidity")}</h2><span class="asof">${tx("週次・月次","Weekly and monthly")}</span></div>${headHTML("liqHead",[h1,h2])}
    ${liqCharts()}
    <div class="mtab lq4"><div class="lq hd"><span></span><span></span><span>${tx("前回比","Prev.")}</span><span>${tx("前年比","Year")}</span></div>${rows}</div>
    <div class="lsrc">${tx("出典","Sources")} FRB H.4.1・H.6 / NY Fed</div>`;
}
// 心: the scene of the day judged as in Mind (US closes before 7:00 Japan time), and Mind's word and bias for the day
const fortuneDay=()=>{const j=new Date(Date.now()+(9-7)*36e5);return j.getUTCFullYear()*10000+(j.getUTCMonth()+1)*100+j.getUTCDate()};
const dayIdx=d=>Math.floor(new Date(Math.floor(d/10000),Math.floor(d/100)%100-1,d%100).getTime()/864e5);
function sceneOf({vix,daily,mri}){
  const cut=fortuneDay(),rows=mri.daily.filter(r=>r[0]<cut&&r[0]!==mri.liveDay&&r[1]),day=rows[rows.length-1][0];
  const days=daily.high.filter(x=>x[0]<cut).map(x=>[x[0],x[1]]);
  rows.forEach(x=>{if(x[0]>days[days.length-1][0])days.push([x[0],x[1]])});
  const {st,ev}=MindEngine.runEvents(days,vix.months),s=st[st.length-1];
  const S=signals(mri,day),sig=k=>S.find(x=>x.k===k).on;
  const done=ev.filter(e=>e.end),last=done[done.length-1];
  const mb=(a,b)=>(Math.floor(b/10000)-Math.floor(a/10000))*12+(Math.floor(b/100)%100-Math.floor(a/100)%100);
  if(s.phase==="panic")return"panic";if(s.phase==="rebound")return"rebound";if(sig("buy"))return"quiet";
  if(st.slice(-5).some(x=>x.high>=x.s1))return"needle";if(sig("tbub")||sig("sell"))return"balloon";
  if(last&&mb(last.end,day)<12)return"after";return"calm";
}
function renderKokoro(){
  const el=$("kokoro"),M=window.MindData;

  el.hidden=false;

}
